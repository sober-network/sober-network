name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore .NET dependencies
        run: dotnet restore src/SoberNetwork.Api/SoberNetwork.Api.csproj

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/SoberNetwork.Web/package-lock.json

      - name: Install Angular dependencies
        run: npm ci
        working-directory: src/SoberNetwork.Web

      - name: Build .NET project (Release)
        run: dotnet build src/SoberNetwork.Api/SoberNetwork.Api.csproj --no-restore --configuration Release

      - name: Build Angular (Production)
        run: npx ng build --configuration production
        working-directory: src/SoberNetwork.Web
