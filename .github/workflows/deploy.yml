name: CI / Deploy

# Runs tests on every push and PR; deploys to Fly.io only when main is updated.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Test ──────────────────────────────────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal

  # ── Deploy ────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Fly.io
    needs: test
    runs-on: ubuntu-latest
    # Only deploy when a commit lands on main (not on PRs)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # flyctl is installed; Fly.io builds the image remotely (no local Docker needed).
      # --remote-only: Fly builds the Dockerfile on their infra, which is faster in CI
      # and avoids needing Docker installed in the GitHub runner.
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
