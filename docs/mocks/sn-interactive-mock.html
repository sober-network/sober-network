<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Sober Network — Interactive Mock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,700&family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@1&display=swap">
  <style>
    /* ══════════════════════════════════════════════════════════════════════
       Design tokens — unprefixed equivalents of Angular's --sn-* tokens
       ══════════════════════════════════════════════════════════════════════ */
    :root {
      --bg: #f7f5f2; --bg-soft: #f0ede8;
      --text: #111110; --text-mid: #3d3d3a; --text-muted: #7a7a75;
      --cta: #1a1a18; --border: rgba(17,17,16,.08);

      /* 8 tints (12% opacity backgrounds) */
      --t-violet: rgba(138,79,163,.12);  --violet: #8a4fa3;
      --t-sky:    rgba(14,165,233,.12);  --sky:    #0ea5e9;
      --t-amber:  rgba(217,119,6,.12);   --amber:  #d97706;
      --t-green:  rgba(42,148,89,.12);   --green:  #2a9459;
      --t-rose:   rgba(225,29,72,.10);   --rose:   #e11d48;
      --t-teal:   rgba(15,118,110,.12);  --teal:   #0f766e;
      --t-indigo: rgba(79,70,229,.12);   --indigo: #4f46e5;
      --t-coral:  rgba(249,115,22,.12);  --coral:  #f97316;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    a, button { font-family: inherit; }

    /* ══════════════════════════════════════════════════════════════════════
       NAVBAR — mirrors navbar.component.scss exactly
       ══════════════════════════════════════════════════════════════════════ */
    .sn-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 64px;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .sn-nav::after {
      content: ''; position: absolute; bottom: -2px; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, #e11d48, #f97316, #eab308, #22c55e, #0ea5e9, #8a4fa3, #e11d48);
      opacity: .6;
    }
    .nav-inner {
      max-width: 1200px; height: 100%; margin: 0 auto; padding: 0 24px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 24px;
    }
    .nav-brand {
      display: flex; align-items: center; gap: 9px;
      text-decoration: none; flex-shrink: 0; cursor: pointer;
    }
    .nav-logo-badge {
      width: 34px; height: 34px; border-radius: 50%;
      background: #1a1a18;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 0 1px rgba(56,189,248,.18), 0 4px 14px rgba(56,189,248,.18), 0 1px 3px rgba(0,0,0,.2);
    }
    .nav-logo-badge svg { width: 32px; height: 32px; }
    .brand-name { font-family: 'Inter Tight', sans-serif; font-weight: 800; font-size: 1rem; color: var(--text); letter-spacing: -0.02em; }
    .nav-center { display: flex; justify-content: center; }
    .nav-pill {
      display: flex; align-items: center; gap: 2px;
      background: rgba(17,17,16,.08); border-radius: 100px; padding: 4px;
    }
    .nlink {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: 100px;
      font-family: 'Inter Tight', sans-serif; font-size: 0.875rem; font-weight: 600;
      color: var(--text-mid); cursor: pointer; border: none; background: transparent;
      text-decoration: none; white-space: nowrap; transition: background .15s, color .15s;
    }
    .nlink:hover { background: rgba(17,17,16,.06); color: var(--text); }
    .nlink.active { background: var(--cta); color: white; }
    .caret-svg { width: 10px; height: 10px; flex-shrink: 0; transition: transform .15s; }
    .nlink[aria-expanded="true"] .caret-svg { transform: rotate(180deg); }
    .nav-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .nav-cta {
      display: inline-flex; align-items: center; gap: 8px; padding: 7px 7px 7px 16px;
      background: #1a1a18;
      color: white; border: none; border-radius: 100px;
      font-family: 'Inter Tight', sans-serif; font-size: 0.88rem; font-weight: 600;
      cursor: pointer; white-space: nowrap;
      transition: opacity .15s;
    }
    .nav-cta:hover { opacity: .9; }
    .arrow-circle {
      width: 20px; height: 20px; border-radius: 50%;
      background: rgba(255,255,255,.18);
      display: flex; align-items: center; justify-content: center;
    }
    .arrow-circle svg { width: 10px; height: 10px; }
    .user-pill {
      display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px;
      background: var(--cta); border-radius: 100px;
      font-family: 'Inter Tight', sans-serif; font-size: 0.875rem; font-weight: 600;
      color: white; cursor: pointer; border: none;
      transition: opacity .15s;
    }
    .user-pill:hover { opacity: .9; }
    .user-initial {
      width: 26px; height: 26px; border-radius: 50%;
      background: rgba(255,255,255,.18);
      color: rgba(255,255,255,.92); font-size: 0.75rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }

    /* ══════════════════════════════════════════════════════════════════════
       DROPDOWN MENUS — plain CSS, not mat-menu
       ══════════════════════════════════════════════════════════════════════ */
    .sn-dropdown-wrap { position: relative; }
    .sn-dropdown {
      display: none; position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%);
      background: white; border-radius: 14px; border: 1px solid rgba(17,17,16,.09);
      box-shadow: 0 10px 40px rgba(0,0,0,.13), 0 2px 6px rgba(0,0,0,.06);
      min-width: 200px; z-index: 200; padding: 8px; animation: sn-dropdown-in .16s ease-out;
    }
    @keyframes sn-dropdown-in { from { opacity: 0; transform: translateX(-50%) translateY(-6px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    .sn-dropdown.open { display: block; }
    .sn-dropdown.right { left: auto; right: 0; transform: none; animation-name: sn-dropdown-right-in; }
    @keyframes sn-dropdown-right-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
    .dd-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px;
      font-size: 0.875rem; font-weight: 600; color: var(--text-mid); cursor: pointer; text-decoration: none;
      transition: background .12s;
    }
    .dd-item:hover { background: var(--bg-soft); }
    .dd-item.warn { color: #b91c1c; }
    .dd-icon { font-size: 0.95rem; width: 20px; text-align: center; }
    .dd-divider { height: 1px; background: rgba(17,17,16,.08); margin: 6px 0; }
    .dd-header { padding: 10px 12px 8px; display: flex; align-items: center; gap: 10px; }
    .dd-name { font-family: 'Inter Tight', sans-serif; font-size: 0.9rem; font-weight: 800; }
    .dd-role { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }

    /* Groups dropdown (My Groups nav item) */
    .groups-dropdown { min-width: 260px; }
    .groups-dropdown .dd-group-item {
      display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px;
      cursor: pointer; text-decoration: none; transition: background .12s;
    }
    .groups-dropdown .dd-group-item:hover { background: var(--bg-soft); }
    .dd-group-icon {
      width: 36px; height: 36px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0;
    }
    .dd-group-name { font-family: 'Inter Tight', sans-serif; font-size: 0.875rem; font-weight: 700; }
    .dd-group-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

    /* ══════════════════════════════════════════════════════════════════════
       STATUS PILLS — Live, Coming Soon, Admin badges
       ══════════════════════════════════════════════════════════════════════ */
    .pill-live { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 100px; background: var(--t-green); color: var(--green); font-size: .68rem; font-weight: 800; font-family: 'Inter Tight', sans-serif; text-transform: uppercase; letter-spacing: .05em; }
    .pill-live::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .pill-cs   { display: inline-block; padding: 2px 8px; border-radius: 100px; background: var(--t-amber); color: var(--amber); font-size: .68rem; font-weight: 800; font-family: 'Inter Tight', sans-serif; text-transform: uppercase; letter-spacing: .05em; }
    .pill-admin{ display: inline-block; padding: 2px 8px; border-radius: 100px; background: var(--t-violet); color: var(--violet); font-size: .68rem; font-weight: 800; font-family: 'Inter Tight', sans-serif; text-transform: uppercase; letter-spacing: .05em; }

    /* ══════════════════════════════════════════════════════════════════════
       GROUP HERO — mirrors group-hero.component.scss
       ══════════════════════════════════════════════════════════════════════ */
    .group-hero {
      position: relative;
      background: linear-gradient(135deg, #dbeafe 0%, #fde8d8 60%, #fef3c7 100%);
      padding: 28px 0 0;
      overflow: hidden;
    }
    .group-hero::before {
      content: ''; position: absolute; inset: 0;
      background: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1400&q=80') center/cover;
      opacity: .05;
    }
    .hero-inner { max-width: 1200px; margin: 0 auto; padding: 0 24px 0; position: relative; }
    .hero-back {
      position: absolute; top: 0; left: 24px;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px 8px 10px; border-radius: 100px;
      font-family: 'Inter Tight', sans-serif; font-size: .82rem; font-weight: 700;
      color: var(--text-mid); background: transparent; border: none; cursor: pointer;
      transition: background .12s;
    }
    .hero-back:hover { background: rgba(255,255,255,.5); }
    .hero-gradient { position: absolute; inset: 0; pointer-events: none; }
    .hero-content { max-width: 1200px; margin: 0 auto; padding: 64px 24px 32px; display: flex; align-items: flex-start; justify-content: space-between; gap: 40px; flex-wrap: wrap; position: relative; }

    /* Breadcrumbs */
    .app-breadcrumbs { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; }
    .bc-item { font-family: 'Inter Tight', sans-serif; font-size: 0.78rem; font-weight: 600; color: rgba(17,17,16,.45); cursor: pointer; text-decoration: none; }
    .bc-item:hover { color: var(--text); }
    .bc-item.current { color: var(--text-mid); cursor: default; }
    .bc-sep { font-size: 0.7rem; color: rgba(17,17,16,.28); }

    .hero-eyebrow {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,.75); backdrop-filter: blur(8px);
      border: 1px solid rgba(17,17,16,.08);
      border-radius: 100px; padding: 5px 12px 5px 8px; margin-bottom: 12px;
      font-family: 'Inter Tight', sans-serif; font-size: 0.72rem; font-weight: 800;
      color: var(--text-mid); letter-spacing: 0.05em; text-transform: uppercase;
    }
    .eyebrow-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
    .hero-title {
      font-family: 'Inter Tight', sans-serif; font-size: clamp(1.6rem, 3vw, 2.25rem);
      font-weight: 900; color: var(--text); letter-spacing: -0.04em; line-height: 1.1;
      margin-bottom: 8px;
    }
    .hero-title .serif-accent {
      display: block; text-align: right; transform: translateX(3rem);
      font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 700;
    }
    .hero-subtitle { font-size: 0.95rem; color: var(--text-mid); max-width: 500px; line-height: 1.5; margin-bottom: 16px; }

    /* Tags card (frosted glass) */
    .hero-tags {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px;
      background: rgba(255,255,255,.85); backdrop-filter: blur(12px);
      border: 1px solid rgba(17,17,16,.08); border-radius: 14px;
      padding: 10px 14px; width: fit-content;
    }
    .tag-chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 10px; border-radius: 999px;
      font-family: 'Inter Tight', sans-serif; font-size: .78rem; font-weight: 800;
      background: rgba(17,17,16,.06); color: var(--text-mid);
    }
    .tag-chip.sky    { background: var(--t-sky);    color: var(--sky); }
    .tag-chip.violet { background: var(--t-violet); color: var(--violet); }
    .tag-chip.green  { background: var(--t-green);  color: var(--green); }

    /* ══════════════════════════════════════════════════════════════════════
       BUTTONS — mirrors landing.component.scss button classes
       ══════════════════════════════════════════════════════════════════════ */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 24px; border-radius: 100px;
      font-family: 'Inter Tight', sans-serif; font-size: 0.9375rem; font-weight: 700;
      cursor: pointer; border: none; text-decoration: none;
      transition: opacity .15s, transform .12s, box-shadow .15s;
    }
    .btn:hover { opacity: .92; }
    .btn:active { transform: scale(.98); }
    .btn.dark { background: var(--cta); color: white; }
    .btn.outline { background: transparent; border: 1.5px solid rgba(17,17,16,.18); color: var(--text); }
    .btn.outline:hover { border-color: rgba(17,17,16,.32); }
    .btn.ghost { background: rgba(255,255,255,.8); backdrop-filter: blur(6px); color: var(--text); border: 1px solid rgba(17,17,16,.08); }
    .btn.light { background: white; color: var(--text); }
    .btn.sm { padding: 8px 16px; font-size: .84rem; }
    .btn.icon-btn { padding: 10px; width: 40px; height: 40px; }

    /* ══════════════════════════════════════════════════════════════════════
       GROUP HUB SHELL — page card + tab rail (from group-hub.component.scss)
       ══════════════════════════════════════════════════════════════════════ */
    .hub-shell {
      max-width: 1200px; margin: 0 auto; padding: 0 24px 80px;
    }
    .page {
      background: rgba(255,255,255,.9);
      border: 1px solid rgba(17,17,16,.09);
      border-radius: 28px; overflow: hidden;
      box-shadow: 0 16px 52px rgba(17,17,16,.07);
      margin-top: 12px;
    }
    .tab-rail {
      padding: 16px 20px 0;
      border-bottom: 1px solid rgba(17,17,16,.09);
      background: rgba(247,245,242,.8);
      display: flex; flex-wrap: wrap; gap: 4px;
    }
    .tab-btn {
      appearance: none;
      border: 1px solid transparent; border-bottom: 0;
      background: transparent;
      padding: 12px 18px 14px;
      font-family: 'Inter Tight', sans-serif; font-weight: 800; font-size: .88rem;
      color: var(--text-muted);
      border-radius: 14px 14px 0 0; margin-bottom: -1px;
      transition: color .15s, background .15s;
      display: flex; align-items: center; gap: 6px;
      cursor: pointer; white-space: nowrap;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active {
      background: white; color: var(--text);
      border-color: rgba(17,17,16,.09); border-bottom-color: white;
    }
    .tab-badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 20px; height: 20px; padding: 0 6px;
      border-radius: 999px; font-size: .72rem; font-weight: 900;
      font-family: 'Inter Tight', sans-serif;
    }
    .tab-badge-violet { background: rgba(138,79,163,.12); color: #8a4fa3; }
    .tab-badge-sky    { background: rgba(14,165,233,.12);  color: #0ea5e9; }
    .tab-badge-green  { background: rgba(42,148,89,.12);   color: #2a9459; }
    .tab-badge-amber  { background: rgba(217,119,6,.12);   color: #d97706; }
    .tab-admin-badge { font-size: .68rem; padding: 2px 7px; border-radius: 999px; font-weight: 800; }
    .tab-panel { /* panels set their own padding */ }

    /* ══════════════════════════════════════════════════════════════════════
       OVERVIEW TAB — cards, banners, avatars, chips (overview-tab.component.scss)
       ══════════════════════════════════════════════════════════════════════ */
    .panel-inner { padding: 24px; }

    /* Next meeting banner */
    .next-meeting-banner {
      display: flex; align-items: center; justify-content: space-between; gap: 18px;
      background: linear-gradient(120deg, rgba(14,165,233,.1) 0%, rgba(42,148,89,.1) 100%);
      border: 1px solid rgba(14,165,233,.18);
      border-radius: 20px; padding: 18px 22px;
      flex-wrap: wrap; margin-bottom: 20px;
      text-decoration: none; color: inherit;
      transition: box-shadow .18s, transform .15s;
    }
    .next-meeting-banner:hover { box-shadow: 0 8px 28px rgba(14,165,233,.18); transform: translateY(-1px); }
    .banner-icon { width: 48px; height: 48px; border-radius: 14px; flex-shrink: 0; background: rgba(14,165,233,.14); display: grid; place-items: center; font-size: 1.4rem; }
    .banner-copy { flex: 1; min-width: 160px; }
    .banner-eyebrow { font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: #0ea5e9; margin-bottom: 3px; }
    .banner-name { font-family: 'Inter Tight', sans-serif; font-weight: 900; font-size: 1.1rem; margin-bottom: 2px; color: var(--text); }
    .banner-when { color: var(--text-mid); font-size: .88rem; }
    .banner-cta { text-align: right; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .countdown-unit { display: inline-flex; align-items: baseline; gap: 2px; padding: 3px 8px; border-radius: 999px; background: rgba(255,255,255,.74); border: 1px solid rgba(17,17,16,.08); font-family: 'Inter Tight', sans-serif; color: var(--text); }
    .countdown-unit strong { font-size: .95rem; font-weight: 900; line-height: 1; font-family: 'Roboto Mono', monospace; }
    .countdown-unit small { font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }

    /* Two-column grid */
    .overview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .overview-col { display: flex; flex-direction: column; gap: 14px; }

    /* Cards */
    .card {
      background: white;
      border: 1px solid rgba(17,17,16,.09);
      border-radius: 18px; padding: 18px;
      box-shadow: 0 6px 20px rgba(17,17,16,.04);
    }
    .card.clickable { cursor: pointer; transition: box-shadow .15s, transform .12s; }
    .card.clickable:hover { box-shadow: 0 8px 28px rgba(17,17,16,.08); transform: translateY(-2px); }
    .section-heading {
      font-family: 'Inter Tight', sans-serif; font-size: .7rem; font-weight: 900;
      text-transform: uppercase; letter-spacing: .09em; color: var(--text-muted); margin-bottom: 10px;
    }
    .card-subtext { font-size: .84rem; color: var(--text-muted); margin-bottom: 11px; line-height: 1.5; }

    /* About card */
    .about-card { background: linear-gradient(135deg, rgba(248,246,241,.9), rgba(240,237,232,.95)); border-color: rgba(17,17,16,.06); position: relative; overflow: hidden; }
    .quote-mark { position: absolute; top: -18px; right: -18px; font-size: 4.5rem; opacity: .07; line-height: 1; pointer-events: none; font-family: Georgia, serif; }
    .about-text { font-size: 1rem; line-height: 1.72; color: var(--text-mid); font-style: italic; }

    /* Membership card */
    .membership-card { background: linear-gradient(135deg, rgba(138,79,163,.07), rgba(79,70,229,.06)); border-color: rgba(138,79,163,.14); }
    .membership-heading { color: #8a4fa3; }
    .membership-identity { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .membership-name { font-family: 'Inter Tight', sans-serif; font-weight: 900; font-size: 1rem; }

    /* Entity rows (admins, servants) */
    .entity-row { display: flex; align-items: flex-start; gap: 14px; padding: 14px; border-radius: 14px; background: var(--bg-soft); border: 1px solid rgba(17,17,16,.06); margin-bottom: 10px; }
    .entity-row:last-child { margin-bottom: 0; }
    .entity-name { font-family: 'Inter Tight', sans-serif; font-weight: 900; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .entity-links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
    .entity-links a { color: var(--cta); font-weight: 800; font-size: .88rem; text-decoration: none; }
    .entity-links a:hover { text-decoration: underline; }

    /* Avatars */
    .avatar { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-family: 'Inter Tight', sans-serif; font-weight: 900; font-size: 1rem; flex-shrink: 0; }
    .av-violet { background: rgba(138,79,163,.22); color: #6d3e86; }
    .av-sky    { background: rgba(14,165,233,.18); color: #0369a1; }
    .av-green  { background: rgba(42,148,89,.18);  color: #166534; }
    .av-rose   { background: rgba(244,63,94,.16);  color: #be185d; }
    .av-amber  { background: rgba(217,119,6,.18);  color: #92400e; }
    .av-teal   { background: rgba(15,118,110,.18); color: #0f766e; }
    .av-coral  { background: rgba(249,115,22,.16); color: #c2410c; }

    /* Chips */
    .chip { display: inline-block; padding: 5px 10px; border-radius: 999px; font-size: .78rem; font-weight: 800; font-family: 'Inter Tight', sans-serif; border: 1px solid transparent; }
    .chip-small { font-size: .68rem; padding: 2px 8px; vertical-align: middle; }
    .chip-violet { background: rgba(138,79,163,.12); color: #8a4fa3; }
    .chip-sky    { background: rgba(14,165,233,.12);  color: #0ea5e9; }
    .chip-green  { background: rgba(42,148,89,.12);   color: #2a9459; }
    .chip-amber  { background: rgba(217,119,6,.12);   color: #d97706; }
    .chip-rose   { background: rgba(217,53,154,.12);  color: #d9359a; }
    .chip-teal   { background: rgba(15,118,110,.12);  color: #0f766e; }
    .chip-indigo { background: rgba(79,70,229,.12);   color: #4f46e5; }
    .chip-coral  { background: rgba(234,94,61,.12);   color: #ea5e3d; }
    .chip-muted  { background: rgba(17,17,16,.06);    color: #7a7a75; }

    /* Detail rows */
    .detail-rows { display: flex; flex-direction: column; gap: 9px; }
    .detail-row { display: flex; align-items: center; gap: 10px; }
    .detail-icon { font-size: .95rem; width: 22px; text-align: center; }
    .detail-text { font-size: .88rem; color: var(--text-mid); }
    .detail-text strong { font-weight: 700; color: var(--text); }
    .detail-text a { color: var(--sky); font-weight: 700; text-decoration: none; }

    .detail-divider { height: 1px; background: rgba(17,17,16,.06); margin: 2px 0; }

    /* Toggle buttons */
    .toggle-button {
      min-width: 72px; height: 36px; padding: 0 14px;
      border-radius: 999px; border: 1px solid rgba(17,17,16,.12);

    .btn-warn-sm {

      cursor: pointer; transition: opacity .15s;
    }

    /* ══════════════════════════════════════════════════════════════════════
       LANDING PAGE — hero, sections, card grids (landing.component.scss)
       ══════════════════════════════════════════════════════════════════════ */
    .hero-section {
      min-height: 560px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      background: linear-gradient(135deg, #dbeafe 0%, #fde8d8 60%, #fef3c7 100%);
      padding: 100px 32px 80px; position: relative; overflow: hidden;
    }
    .hero-section::before {
      content: ''; position: absolute; inset: 0;
      background: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1400&q=80') center/cover;
      opacity: .06;
    }
    .hero-wrap { position: relative; max-width: 720px; }
    .hero-eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,.8); backdrop-filter: blur(8px);
      border: 1px solid rgba(17,17,16,.08); border-radius: 100px;
      padding: 6px 14px; margin-bottom: 18px;
      font-family: 'Inter Tight', sans-serif; font-size: .75rem; font-weight: 800;
      color: var(--text-mid); letter-spacing: .04em; text-transform: uppercase;
    }
    .hero-title {
      font-family: 'Inter Tight', sans-serif;
      font-size: clamp(2.5rem, 6vw, 4.2rem);
      font-weight: 900; letter-spacing: -0.045em; line-height: 1.05; margin-bottom: 18px;
    }
    .hero-title .serif-accent {
      font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400;
    }
    .hero-lead {
      font-size: 1.1rem; color: var(--text-mid); line-height: 1.6;
      margin-bottom: 32px; max-width: 540px; margin-left: auto; margin-right: auto;
    }
    .hero-ctas { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .landing-hero {
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start; text-align: center;
      background-image:
        linear-gradient(135deg,
          rgba(212,232,245,0.88) 0%,
          rgba(232,240,248,0.85) 20%,
          rgba(247,245,240,0.82) 55%,
          rgba(245,232,216,0.85) 80%,
          rgba(240,223,200,0.88) 100%),
        url('https://static.vecteezy.com/system/resources/previews/011/930/314/non_2x/young-friends-staying-together-outdoor-in-the-park-free-photo.jpg');
      background-size: cover; background-position: center top;
      padding: 110px 32px 90px; position: relative; overflow: hidden;
    }
    .landing-hero-inner { position: relative; max-width: 880px; }
    .landing-eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,.65); border: 1px solid rgba(17,17,16,.10);
      border-radius: 100px; padding: 5px 14px; margin-bottom: 36px;
      font-family: 'Inter Tight', sans-serif; font-size: .75rem; font-weight: 600;
      color: var(--text-mid); letter-spacing: .08em; text-transform: uppercase;
    }
    .landing-eyebrow::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%; background: #38b86a;
    }
    .landing-title {
      font-family: 'Inter Tight', sans-serif;
      font-size: clamp(3rem, 6.5vw, 5.6rem);
      font-weight: 900; letter-spacing: -0.04em; line-height: 1.12; margin-bottom: 20px;
      color: var(--text); overflow: visible;
    }
    /* Block lines for stagger control */
    .title-line { display: block; }
    /* Inline serif word — gradient, italic, Instrument Serif */
    .serif-inline {
      font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400;
      background: linear-gradient(120deg, #0ea5e9 0%, #fb923c 55%, #e11d48 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .landing-title .serif {
      display: block;
      font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400;
      font-size: 1.05em; letter-spacing: -0.03em;
    }
    .landing-lead {
      font-size: 1.05rem; color: var(--text-mid); line-height: 1.7;
      margin-bottom: 40px; max-width: 500px; margin-left: auto; margin-right: auto;
    }
    .landing-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; align-items: center; }
    .trust-strip {
      display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
      margin-top: 48px;
    }
    .trust-item {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.8rem; color: var(--text-muted);
      font-family: 'Inter Tight', sans-serif; font-weight: 500;
    }
    .trust-icon {
      width: 22px; height: 22px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .trust-icon svg { width: 12px; height: 12px; }
    .trust-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--text-muted); opacity: 0.4; display: inline-block; }
    /* Marquee */
    .sn-marquee {
      background: white; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
      overflow: hidden; padding: 20px 0;
    }
    .marquee-track {
      display: flex; width: max-content;
      animation: marquee 32s linear infinite;
    }
    .marquee-item {
      display: flex; align-items: center; gap: 9px; padding: 4px 20px 4px 16px;
      font-family: 'Inter Tight', sans-serif; font-size: 0.78rem; font-weight: 600;
      letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-muted);
      white-space: nowrap; border-right: 1px solid var(--border);
    }
    .mi-icon {
      width: 28px; height: 28px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .mi-icon svg { width: 13px; height: 13px; }
    @keyframes marquee {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .stats-row {
      display: flex; gap: 40px; justify-content: center; flex-wrap: wrap;
      padding: 28px 32px; background: white; border-bottom: 1px solid var(--border);
    }
    .stat-item { text-align: center; }
    .stat-num { font-family: 'Inter Tight', sans-serif; font-size: 1.75rem; font-weight: 900; color: var(--text); }
    .stat-label { font-size: 0.78rem; color: var(--text-muted); font-weight: 600; margin-top: 3px; }

    /* Back-to-top anchor — absolute top-right of each section-wrap */
    .back-to-top {
      position: absolute; top: 80px; right: 32px;
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid rgba(17,17,16,.14);
      background: rgba(255,255,255,.6);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-mid); text-decoration: none;
      transition: background .15s, border-color .15s, transform .15s;
    }
    .back-to-top svg { width: 12px; height: 12px; }
    .back-to-top:hover { background: rgba(255,255,255,.9); border-color: rgba(17,17,16,.28); transform: translateY(-2px); }
    .section-dark .back-to-top { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.2); color: white; }
    .section-dark .back-to-top:hover { background: rgba(255,255,255,.18); }

    /* Landing sections */
    .section { padding: 0; }
    .section-wrap { max-width: 1200px; margin: 0 auto; padding: 80px 32px; position: relative; }
    .section-white { background: white; }
    .section-bg { background: var(--bg); }
    .section-dark { background: var(--cta); color: white; }
    .section-eyebrow {
      font-family: 'Inter Tight', sans-serif; font-size: .72rem; font-weight: 900;
      text-transform: uppercase; letter-spacing: .1em; color: var(--violet);
      margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
    }
    .section-dark .section-eyebrow { color: rgba(255,255,255,.6); }
    .section-title {
      font-family: 'Inter Tight', sans-serif; font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 900; letter-spacing: -0.035em; line-height: 1.1; margin-bottom: 12px;
    }
    .section-title .serif { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; }
    .section-subtitle { font-size: 1rem; color: var(--text-mid); line-height: 1.6; max-width: 560px; }
    .section-dark .section-subtitle { color: rgba(255,255,255,.7); }

    /* Feature cards grid */
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 32px; }
    .card-grid.three-col { grid-template-columns: repeat(3, 1fr); }
    .feature-card {
      background: white; border: 1px solid rgba(17,17,16,.08);
      border-radius: 20px; padding: 24px;
      transition: box-shadow .18s, transform .12s;
    }
    .feature-card:hover { box-shadow: 0 12px 36px rgba(17,17,16,.08); transform: translateY(-3px); }
    .feature-icon {
      width: 48px; height: 48px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; margin-bottom: 16px;
    }
    .feature-title { font-family: 'Inter Tight', sans-serif; font-size: 1rem; font-weight: 800; margin-bottom: 6px; }
    .feature-desc { font-size: 0.875rem; color: var(--text-muted); line-height: 1.5; }
    .card-icon {
      width: 48px; height: 48px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; margin-bottom: 16px;
    }
    .card-title { font-family: 'Inter Tight', sans-serif; font-size: 1rem; font-weight: 800; margin-bottom: 6px; }
    .card-desc { font-size: 0.875rem; color: var(--text-muted); line-height: 1.5; }
    /* Section title and lead */
    .section-title { font-family: 'Inter Tight', sans-serif; font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 900; letter-spacing: -0.035em; line-height: 1.1; margin-bottom: 12px; }
    .section-title .serif-accent { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; }
    .section-lead { font-size: 1rem; color: var(--text-mid); line-height: 1.6; max-width: 560px; margin-bottom: 24px; }
    .section-dark .section-lead { color: rgba(255,255,255,.7); }
    /* How It Works */
    .how-it-works-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; margin-top: 32px; }
    .step-card {
      background: var(--bg-soft); border-radius: 20px; padding: 36px 28px;
      display: flex; flex-direction: column; gap: 12px;
      transition: box-shadow .18s, transform .12s;
    }
    .step-card:hover { box-shadow: 0 12px 36px rgba(17,17,16,.07); transform: translateY(-3px); }
    .step-num { font-family: 'Inter Tight', sans-serif; font-size: 3rem; font-weight: 900; letter-spacing: -0.06em; color: rgba(17,17,16,.08); line-height: 1; }
    /* (removed duplicate pill-style step-num) */
    .step-title { font-family: 'Inter Tight', sans-serif; font-size: 1.05rem; font-weight: 800; margin-bottom: 8px; }
    .step-desc { font-size: .88rem; color: var(--text-muted); line-height: 1.5; }
    /* ── Beauty pass ────────────────────────────────────────────────────────── */

    /* Gradient text utility */
    .grad-text {
      background: linear-gradient(120deg, #8a4fa3 0%, #e11d48 90%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    /* Hero serif line: warmer sky→rose matches the hero gradient — also applies to .serif-inline */
    .landing-title .serif,
    .serif-inline {
      background: linear-gradient(120deg, #0ea5e9 0%, #fb923c 55%, #e11d48 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    /* The full serif line is slightly bigger */
    .landing-title .serif { font-size: 1.05em; padding-bottom: 0.12em; }
    /* Section serif accents: violet→rose throughout */
    .section-title .serif-accent {
      background: linear-gradient(120deg, #8a4fa3 0%, #e11d48 90%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    /* Don't clip text on dark backgrounds */
    .section-dark .section-title .serif-accent {
      background: none; -webkit-text-fill-color: rgba(255,255,255,.65);
    }

    /* Section eyebrow color per section */
    #about    .section-eyebrow { color: var(--violet); }
    #features .section-eyebrow { color: var(--sky); }
    #how-it-works .section-eyebrow { color: var(--teal); }
    #traditions .section-eyebrow { color: var(--amber); }
    #final-cta .section-eyebrow { color: rgba(255,255,255,.5); }

    /* Feature cards — colored top stripe + lifted shadow on hover */
    .feature-card { position: relative; overflow: hidden; }
    .feature-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: var(--card-accent, var(--violet));
      opacity: 0; transition: opacity .2s;
    }
    .feature-card:hover::before { opacity: 1; }
    .feature-card:hover {
      box-shadow: 0 16px 48px rgba(17,17,16,.1), 0 2px 8px rgba(17,17,16,.04);
      transform: translateY(-4px);
    }
    /* Step cards — left accent bar */
    .step-card { position: relative; border-left: 3px solid transparent; }
    .step-card:nth-child(1) { border-left-color: var(--violet); }
    .step-card:nth-child(2) { border-left-color: var(--sky); }
    .step-card:nth-child(3) { border-left-color: var(--green); }
    .step-card:hover {
      box-shadow: 0 16px 48px rgba(17,17,16,.09), 0 2px 8px rgba(17,17,16,.03);
      transform: translateY(-4px);
    }
    /* Step number: ghost gradient */
    .step-num {
      background: linear-gradient(135deg, var(--violet), var(--sky));
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 3.2rem; font-weight: 900; letter-spacing: -0.06em;
      opacity: .18; line-height: 1;
    }

    /* Traditions */
    .traditions-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 28px; }
    .tradition-card {
      background: white; border: 1px solid rgba(17,17,16,.08);
      border-radius: 16px; padding: 20px;
      border-left: 4px solid var(--tcard-color, var(--violet));
      transition: box-shadow .18s, transform .12s;
    }
    .tradition-card:hover { box-shadow: 0 10px 32px rgba(17,17,16,.08); transform: translateY(-2px); }
    .tradition-num {
      display: inline-block; padding: 3px 10px; border-radius: 999px;
      background: var(--tcard-color, var(--violet));
      color: white;
      font-family: 'Inter Tight', sans-serif; font-size: .72rem; font-weight: 900; margin-bottom: 10px;
      opacity: .85;
    }
    .tradition-text { font-size: .85rem; color: var(--text-mid); line-height: 1.6; }

    /* Final CTA — mesh gradient */
    .section-dark {
      background: #1a1a18;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(138,79,163,.35) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 40%, rgba(14,165,233,.22) 0%, transparent 55%),
        radial-gradient(ellipse at 50% 90%, rgba(251,146,60,.15) 0%, transparent 50%);
    }

    /* Stat number: already colored via inline — just size-up */
    .stat-num { font-size: 2.2rem; }

    /* About section: very subtle pastel wash */
    #about.section-white {
      background-image: radial-gradient(ellipse at 90% 10%, rgba(138,79,163,.06) 0%, transparent 50%),
                        radial-gradient(ellipse at 10% 80%, rgba(14,165,233,.05) 0%, transparent 50%);
    }

    /* Features section: soft warm bg */
    #features { background: var(--bg-soft); }

    /* How-it-works section: paper texture feel */
    #how-it-works { background: white; }
    #how-it-works .step-card { background: var(--bg-soft); }

    /* Traditions section: same bg-soft */
    #traditions { background: var(--bg-soft); }

    /* Dashboard card grid */
    .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .group-card {
      background: white; border: 1px solid rgba(17,17,16,.09);
      border-radius: 18px; padding: 18px; cursor: pointer;
      transition: box-shadow .15s, transform .12s;
    }
    .group-card:hover { box-shadow: 0 8px 28px rgba(17,17,16,.08); transform: translateY(-2px); }
    .group-card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .group-card-icon { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-size: 1.2rem; flex-shrink: 0; }
    .group-card-title { font-family: 'Inter Tight', sans-serif; font-weight: 800; font-size: .95rem; }
    .group-card-meta { font-size: .78rem; color: var(--text-muted); margin-top: 2px; }
    .group-card-footer { font-size: .84rem; color: var(--text-muted); }

    /* Page shell (for simple pages) */
    .page-shell { max-width: 1200px; margin: 0 auto; padding: 32px 24px 80px; }

    /* ══════════════════════════════════════════════════════════════════════
       MEETINGS TAB — meeting cards (meetings-tab.component.scss)
       ══════════════════════════════════════════════════════════════════════ */
    .meetings-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
    .meeting-card { display: flex; gap: 16px; padding: 18px; background: white; border: 1px solid rgba(17,17,16,.09); border-radius: 18px; margin-bottom: 12px; box-shadow: 0 4px 16px rgba(17,17,16,.03); transition: box-shadow .15s; }
    .meeting-card:hover { box-shadow: 0 8px 28px rgba(17,17,16,.08); }
    .meeting-day-badge { width: 54px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 0; border-radius: 12px; background: var(--t-sky); }
    .meeting-day-abbr { font-family: 'Inter Tight', sans-serif; font-size: .7rem; font-weight: 800; text-transform: uppercase; color: var(--sky); }
    .meeting-day-num { font-family: 'Inter Tight', sans-serif; font-size: 1.4rem; font-weight: 900; color: var(--text); }
    .meeting-info { flex: 1; }
    .meeting-title { font-family: 'Inter Tight', sans-serif; font-weight: 800; font-size: .95rem; margin-bottom: 4px; }
    .meeting-time { font-size: .84rem; color: var(--text-muted); }
    .meeting-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .meeting-actions { flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }

    /* ══════════════════════════════════════════════════════════════════════
       MEMBERS TAB — member cards (members-tab.component.scss)
       ══════════════════════════════════════════════════════════════════════ */
    .members-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
    .member-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
    .member-card { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: white; border: 1px solid rgba(17,17,16,.09); border-radius: 14px; transition: box-shadow .15s; }
    .member-card:hover { box-shadow: 0 6px 20px rgba(17,17,16,.06); }
    .member-meta { flex: 1; min-width: 0; }
    .member-name { font-family: 'Inter Tight', sans-serif; font-weight: 800; font-size: .9rem; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .member-joined { font-size: .78rem; color: var(--text-muted); margin-top: 2px; }

    /* ══════════════════════════════════════════════════════════════════════
       REQUESTS TAB — request cards (requests-tab.component.scss)
       ══════════════════════════════════════════════════════════════════════ */
    .requests-panel { padding: 24px; }
    .request-card { display: flex; align-items: flex-start; gap: 16px; padding: 18px; background: white; border: 1px solid rgba(17,17,16,.09); border-radius: 16px; margin-bottom: 12px; }
    .request-info { flex: 1; }
    .request-name { font-family: 'Inter Tight', sans-serif; font-weight: 800; font-size: .95rem; margin-bottom: 4px; }
    .request-date { font-size: .82rem; color: var(--text-muted); }

// ── renderNav ──────────────────────────────────────────────────────────────
// Matches navbar.component.html dropdown pattern (NOT mat-menu)
function renderNav() {
  const center  = document.getElementById('nav-center');
  const actions = document.getElementById('nav-actions');
  const isGroupRoute = currentRoute.startsWith('/groups') || currentRoute === '/dashboard' || currentRoute === '/profile';

  if (authState === 'guest') {
    // Guest: Landing page section pills
    center.innerHTML = `
      <div class="nav-pill">
        <a class="nlink ${currentRoute==='/'?'active':''}" onclick="scrollToSection('about')">About</a>
        <a class="nlink" onclick="scrollToSection('features')">Features</a>
        <a class="nlink" onclick="scrollToSection('traditions')">12 Traditions</a>
        <a class="nlink ${currentRoute==='/meetings'?'active':''}" onclick="navigate('/meetings')">Find a Meeting</a>
      </div>`;
    actions.innerHTML = `
      <button class="nav-cta" onclick="signIn()">Sign In
        <span class="arrow-circle"><svg viewBox="0 0 12 12" fill="none"><path d="M1 11L11 1M11 1H4.5M11 1V7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </button>`;
  } else {
    // Member: Find a Meeting, My Groups dropdown, user pill
    center.innerHTML = `
      <div class="nav-pill">
        <a class="nlink ${currentRoute==='/meetings'?'active':''}" onclick="navigate('/meetings')">Find a Meeting</a>
        <div class="dropdown-wrap">
          <button class="nlink dropdown-trigger ${isGroupRoute?'active':''}" onclick="toggleGroupsDrop(event)">
            My Groups
            <svg class="caret-svg" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 3.5L5 6.5L8 3.5"/></svg>
          </button>
          <div class="groups-dropdown" id="groups-dropdown">
            <div class="dd-section-title">My Groups</div>
            <a class="dd-group-item" onclick="navigate('/groups/early-bird-zoom');closeGroupsDrop()">
              <div class="dd-group-icon" style="background:var(--t-sky)">🌅</div>
              <div class="dd-group-info">
                <span class="dd-group-name">Early Bird Zoom</span>
                <span class="dd-group-meta">Online · 7:00 AM</span>
              </div>
              <span class="pill-admin sm">Admin</span>
            </a>
            <a class="dd-group-item" onclick="navigate('/groups/early-bird-zoom');closeGroupsDrop()">
              <div class="dd-group-icon" style="background:var(--t-rose)">🏡</div>
              <div class="dd-group-info">
                <span class="dd-group-name">Downtown Thu Night</span>
                <span class="dd-group-meta">In-Person · 7:30 PM</span>
              </div>
            </a>
            <div class="dd-divider"></div>
            <a class="dd-item" onclick="navigate('/dashboard');closeGroupsDrop()"><span class="dd-icon">📋</span> All My Groups</a>
            <a class="dd-item" onclick="alert('Create Group');closeGroupsDrop()"><span class="dd-icon">➕</span> Create Group</a>
          </div>
        </div>
      </div>`;
    actions.innerHTML = `
      <div class="user-wrap">
        <button class="user-pill" onclick="toggleUserDrop(event)">
          <span class="user-name">Tess C.</span>
          <span class="user-initial">T</span>
        </button>
        <div class="user-dropdown" id="user-dropdown">
          <div class="dd-header">
            <div class="dd-avatar" style="background:#e879f9">T</div>
            <div class="dd-user-info">
              <span class="dd-name">Tess C.</span>
              <span class="dd-email">tess.c@example.com</span>
            </div>
          </div>
          <div class="dd-divider"></div>
          <a class="dd-item" onclick="navigate('/profile');closeUserDrop()"><span class="dd-icon">👤</span> My Profile</a>
          <a class="dd-item" onclick="navigate('/dashboard');closeUserDrop()"><span class="dd-icon">🏠</span> Dashboard</a>
          <div class="dd-divider"></div>
          <a class="dd-item warn" onclick="signOut()"><span class="dd-icon">↩</span> Sign Out</a>
        </div>
      </div>`;
  }
}

// ── renderHero ─────────────────────────────────────────────────────────────
// Renders different hero layouts based on route type:
// - Landing page: no hero (sections have their own headers)
// - Simple pages: basic page header (dashboard, meetings finder, profile)
// - Group hub: full group hero with serif accent title and 5-tab rail
function renderHero(config) {
  // Landing page has no hero
  if (currentRoute === '/') return '';
  
  // Check if this is a group hub route
  const isGroupHub = currentRoute.startsWith('/groups/');
  
  if (isGroupHub) {
    // Group Hub Hero with serif accent and tab rail
    const GROUP_TABS = [
      { key: 'overview', label: 'Overview', icon: '📋', route: '/groups/early-bird-zoom' },
      { key: 'members', label: 'Members', icon: '👥', badge: '24', badgeColor: 'violet', route: '/groups/early-bird-zoom/members' },
      { key: 'meetings', label: 'Meetings', icon: '🗓️', badge: '5', badgeColor: 'sky', route: '/groups/early-bird-zoom/meetings' },
      { key: 'requests', label: 'Requests', icon: '📥', badge: 'Admin', badgeColor: 'green', admin: true, route: '/groups/early-bird-zoom/requests' },
      { key: 'settings', label: 'Settings', icon: '⚙️', badge: 'Admin', badgeColor: 'amber', admin: true, route: '/groups/early-bird-zoom/settings' },
    ];
    
    const tabsHtml = GROUP_TABS.map(t => {
      const active = currentRoute === t.route;
      const badgeHtml = t.badge ? `<span class="tab-badge ${t.badgeColor}">${t.badge}</span>` : '';
      const adminClass = t.admin ? 'admin-tab' : '';
      return `<button class="tab-btn ${active?'active':''} ${adminClass}" onclick="navigate('${t.route}')">${t.label} ${badgeHtml}</button>`;
    }).join('');
    
    return `
    <!-- ════ GROUP HERO (group-hero.component pattern) ════════════════════ -->
    <div class="group-hero">
      <div class="hero-gradient"></div>
      <div class="hero-content">
        <div class="hero-left">
          <h1 class="group-title">
            Early Bird<br>
            <span class="serif-accent">Zoom Meeting</span>
          </h1>
          <p class="group-subtitle">Online · Mon–Fri 7:00 AM EST</p>
        </div>
        <div class="hero-right">
          <div class="tags-card">
            <div class="tag-row"><span class="tag-label">Format</span><span class="tag-value">🎤 Speaker</span></div>
            <div class="tag-row"><span class="tag-label">Type</span><span class="tag-value">🌐 Online</span></div>
            <div class="tag-row"><span class="tag-label">Access</span><span class="tag-value">🔒 Closed</span></div>
            <div class="tag-row"><span class="tag-label">Members</span><span class="tag-value">👥 24</span></div>
          </div>
        </div>
      </div>
    </div>
    <!-- ════ TAB RAIL (inside group-hub page card) ════════════════════════ -->
    <div class="page-card">
      <div class="tab-rail">${tabsHtml}</div>
      <div class="tab-content">
    `;
  }
  
  // Simple page header for dashboard, meetings, profile
  const breadcrumbs = config.breadcrumbs || [];
  const crumbsHtml = breadcrumbs.length ? `
    <div class="breadcrumbs">
      ${breadcrumbs.map(b => `<a class="bc-item" onclick="navigate('${b.route}')">${b.label}</a><span class="bc-sep">›</span>`).join('')}
      <span class="bc-item current">${config.title.replace(/<[^>]*>/g,'')}</span>
    </div>` : '';
  
  return `
    <div class="page-header">
      ${crumbsHtml}
      <h1 class="page-title">${config.title}</h1>
      ${config.subtitle ? `<p class="page-subtitle">${config.subtitle}</p>` : ''}
    </div>
    <div class="page-card simple">
  `;
}

// ── navigate ───────────────────────────────────────────────────────────────
function navigate(route) {
  const config = ROUTES[route];
  if (!config) return;

  // Soft auth guard: clicking member content auto-signs in for demo
  if (config.auth === 'member' && authState === 'guest') {
    authState = 'member';
  }

  currentRoute = route;
  closeGroupsDrop();
  closeUserDrop();
  renderNav();

  document.getElementById('route-display').textContent = route;

  const main = document.getElementById('app-main');
  const content = PAGES[route] ? PAGES[route]() : `<div class="placeholder-block">This page is coming soon.</div>`;

  if (config.layout === 'landing') {
    // Landing page: no hero, raw sections
    main.innerHTML = content;
  } else if (currentRoute.startsWith('/groups/')) {
    // Group hub: hero + page-card with tab rail and content
    main.innerHTML = renderHero(config) + content + `</div></div><!-- close tab-content + page-card -->`;
  } else {
    // Simple pages: header + page-card
    main.innerHTML = renderHero(config) + content + `</div><!-- close page-card -->`;
  }

  window.scrollTo(0, 0);
}

// ── Auth helpers ──────────────────────────────────────────────────────────
function signIn()  { authState = 'member'; navigate('/dashboard'); }
function signOut() { authState = 'guest';  navigate('/'); }

// ── Scroll to section (landing page) ──────────────────────────────────────
function scrollToSection(sectionId) {
  if (currentRoute !== '/') navigate('/');
  setTimeout(() => {
    const el = document.getElementById(sectionId);
    if (el) el.scrollIntoView({ behavior: 'smooth' });
  }, 100);
}

// ── Groups dropdown ───────────────────────────────────────────────────────
function toggleGroupsDrop(e) {
  e.stopPropagation();
  groupsDropOpen = !groupsDropOpen;
  const d = document.getElementById('groups-dropdown');
  if (d) d.classList.toggle('open', groupsDropOpen);
  // Close user dropdown if open
  if (groupsDropOpen) closeUserDrop();
}
function closeGroupsDrop() {
  groupsDropOpen = false;
  const d = document.getElementById('groups-dropdown');
  if (d) d.classList.remove('open');
}

// ── User dropdown ─────────────────────────────────────────────────────────
function toggleUserDrop(e) {
  e.stopPropagation();
  userDropOpen = !userDropOpen;
  const d = document.getElementById('user-dropdown');
  if (d) d.classList.toggle('open', userDropOpen);
  // Close groups dropdown if open
  if (userDropOpen) closeGroupsDrop();
}
function closeUserDrop() {
  userDropOpen = false;
  const d = document.getElementById('user-dropdown');
  if (d) d.classList.remove('open');
}

// Close all dropdowns when clicking outside
document.addEventListener('click', () => { closeGroupsDrop(); closeUserDrop(); });

// Boot
navigate('/');
</script>
