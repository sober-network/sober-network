<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Sober Network — Interactive Mock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,700&family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@1&display=swap">
  <style>
    /* ── Design tokens ──────────────────────────────────────────────────── */
    :root {
      --bg: #f7f5f2; --bg-soft: #f0ede8;
      --text: #111110; --text-mid: #3d3d3a; --text-muted: #7a7a75;
      --cta: #1a1a18; --border: rgba(17,17,16,.10);
      --t-violet: rgba(124,58,237,.10);  --violet: #7c3aed;
      --t-sky:    rgba(14,165,233,.10);  --sky:    #0ea5e9;
      --t-amber:  rgba(217,119,6,.12);   --amber:  #d97706;
      --t-green:  rgba(22,163,74,.10);   --green:  #16a34a;
      --t-rose:   rgba(225,29,72,.10);   --rose:   #e11d48;
      --t-teal:   rgba(20,184,166,.10);  --teal:   #14b8a6;
      --t-indigo: rgba(99,102,241,.10);  --indigo: #6366f1;
      --t-coral:  rgba(249,115,22,.10);  --coral:  #f97316;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    a, button { font-family: inherit; }

    /* ── NAVBAR ─────────────────────────────────────────────────────────── */
    .sn-nav {
      position: sticky; top: 0; z-index: 100;
      background: white; border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 0 rgba(17,17,16,.04);
    }
    .nav-inner {
      max-width: 1200px; margin: 0 auto; padding: 0 24px;
      height: 64px; display: flex; align-items: center; gap: 16px;
    }
    .nav-brand {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none; flex-shrink: 0; cursor: pointer;
    }
    .nav-logo-ring {
      width: 36px; height: 36px; border-radius: 50%;
      background: conic-gradient(from 0deg, #e11d48, #f97316, #eab308, #22c55e, #0ea5e9, #7c3aed, #e11d48);
      display: flex; align-items: center; justify-content: center;
    }
    .nav-logo-ring svg { width: 18px; height: 18px; }
    .brand-name { font-family: 'Inter Tight', sans-serif; font-weight: 800; font-size: 1rem; color: var(--text); letter-spacing: -0.02em; }
    .nav-center { flex: 1; display: flex; justify-content: center; }
    .nav-pill {
      display: flex; align-items: center; gap: 2px;
      background: var(--bg); border-radius: 100px; padding: 4px;
    }
    .nlink {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: 100px;
      font-family: 'Inter Tight', sans-serif; font-size: 0.875rem; font-weight: 600;
      color: var(--text-mid); cursor: pointer; border: none; background: transparent;
      text-decoration: none; white-space: nowrap; transition: background .15s, color .15s;
    }
    .nlink:hover { background: rgba(17,17,16,.06); color: var(--text); }
    .nlink.active { background: var(--text); color: white; }
    .caret-svg { width: 10px; height: 10px; flex-shrink: 0; }
    .nav-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .nav-cta {
      display: flex; align-items: center; gap: 8px; padding: 8px 16px 8px 20px;
      background: linear-gradient(135deg, #1a1a18 0%, #2d2d2a 100%);
      color: white; border: none; border-radius: 100px;
      font-family: 'Inter Tight', sans-serif; font-size: 0.875rem; font-weight: 700;
      cursor: pointer; letter-spacing: -0.01em;
    }
    .arrow-circle {
      width: 20px; height: 20px; border-radius: 50%;
      background: rgba(255,255,255,.18);
      display: flex; align-items: center; justify-content: center;
    }
    .arrow-circle svg { width: 10px; height: 10px; }
    .user-pill {
      display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px;
      background: var(--bg); border-radius: 100px; border: 1px solid var(--border);
      font-family: 'Inter Tight', sans-serif; font-size: 0.875rem; font-weight: 600;
      color: var(--text); cursor: pointer;
    }
    .user-initial {
      width: 26px; height: 26px; border-radius: 50%; background: var(--cta);
      color: white; font-size: 0.75rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── MEGA MENU ──────────────────────────────────────────────────────── */
    .mega-anchor { position: static; }
    .mega-menu {
      display: none; position: absolute; top: 64px; left: 50%; transform: translateX(-50%);
      background: white; border-radius: 16px; border: 1px solid var(--border);
      box-shadow: 0 8px 40px rgba(0,0,0,.12); padding: 20px;
      grid-template-columns: repeat(4, 200px); gap: 8px; z-index: 200;
    }
    .mega-menu.open { display: grid; }
    .mm-col { display: flex; flex-direction: column; gap: 4px; }
    .mm-col-head {
      display: flex; align-items: center; gap: 6px; padding: 4px 8px 8px;
      font-family: 'Inter Tight', sans-serif; font-size: 0.7rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted);
    }
    .mm-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .mm-item {
      display: flex; align-items: flex-start; gap: 10px; padding: 8px;
      border-radius: 10px; border: none; background: transparent;
      cursor: pointer; text-align: left; width: 100%; transition: background .12s;
    }
    .mm-item:hover { background: var(--bg); }
    .mm-icon {
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0;
    }
    .mm-name { font-family: 'Inter Tight', sans-serif; font-size: 0.8125rem; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 5px; }
    .mm-desc { font-size: 0.74rem; color: var(--text-muted); margin-top: 1px; line-height: 1.3; }

    /* ── USER DROPDOWN ──────────────────────────────────────────────────── */
    .user-wrap { position: relative; }
    .user-dropdown {
      display: none; position: absolute; top: calc(100% + 8px); right: 0;
      background: white; border: 1px solid var(--border); border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.10); min-width: 200px; z-index: 200; padding: 6px;
    }
    .user-dropdown.open { display: block; }
    .dd-header { padding: 8px 10px 10px; }
    .dd-name { display: block; font-family: 'Inter Tight', sans-serif; font-size: 0.875rem; font-weight: 700; }
    .dd-role { display: block; font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
    .dd-divider { height: 1px; background: var(--border); margin: 4px 0; }
    .dd-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; font-size: 0.84rem; color: var(--text-mid); cursor: pointer; text-decoration: none; }
    .dd-item:hover { background: var(--bg); }
    .dd-item.warn { color: var(--rose); }
    .dd-icon { font-size: 0.9rem; }

    /* ── STATUS PILLS ───────────────────────────────────────────────────── */
    .pill-live { display: inline-block; padding: 1px 6px; border-radius: 100px; background: var(--t-green); color: var(--green); font-size: .65rem; font-weight: 700; font-family: 'Inter Tight', sans-serif; text-transform: uppercase; letter-spacing: .05em; }
    .pill-cs   { display: inline-block; padding: 1px 6px; border-radius: 100px; background: var(--t-amber); color: var(--amber); font-size: .65rem; font-weight: 700; font-family: 'Inter Tight', sans-serif; text-transform: uppercase; letter-spacing: .05em; }
    .pill-admin{ display: inline-block; padding: 1px 6px; border-radius: 100px; background: var(--t-violet); color: var(--violet); font-size: .65rem; font-weight: 700; font-family: 'Inter Tight', sans-serif; text-transform: uppercase; letter-spacing: .05em; }

    /* ── APP-HERO ───────────────────────────────────────────────────────── */
    .app-hero {
      background: linear-gradient(135deg, #dbeafe 0%, #fde8d8 60%, #fef3c7 100%);
      padding: 28px 0 0; position: relative; overflow: hidden;
    }
    .app-hero::before {
      content: ''; position: absolute; inset: 0;
      background: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1400&q=80') center/cover;
      opacity: .05;
    }
    .hero-inner { max-width: 1200px; margin: 0 auto; padding: 0 32px 28px; position: relative; }

    /* Breadcrumbs — ng-content projected slot */
    .app-breadcrumbs { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; }
    .bc-item { font-family: 'Inter Tight', sans-serif; font-size: 0.78rem; font-weight: 600; color: rgba(17,17,16,.45); cursor: pointer; text-decoration: none; }
    .bc-item:hover { color: var(--text); }
    .bc-item.current { color: var(--text-mid); cursor: default; }
    .bc-sep { font-size: 0.7rem; color: rgba(17,17,16,.28); }

    .hero-eyebrow {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,.75); border: 1px solid rgba(17,17,16,.08);
      border-radius: 100px; padding: 4px 12px; margin-bottom: 10px;
      font-family: 'Inter Tight', sans-serif; font-size: 0.72rem; font-weight: 700;
      color: var(--text-mid); letter-spacing: 0.05em; text-transform: uppercase;
    }
    .hero-title {
      font-family: 'Inter Tight', sans-serif; font-size: clamp(1.6rem, 3vw, 2.25rem);
      font-weight: 900; color: var(--text); letter-spacing: -0.04em; line-height: 1.1;
      margin-bottom: 8px;
    }
    .hero-title .serif { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; }
    .hero-subtitle { font-size: 0.9375rem; color: var(--text-mid); max-width: 500px; line-height: 1.5; margin-bottom: 16px; }
    .hero-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .meta-badge {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(255,255,255,.75); border: 1px solid rgba(17,17,16,.08);
      border-radius: 100px; padding: 3px 10px;
      font-family: 'Inter Tight', sans-serif; font-size: 0.74rem; font-weight: 700; color: var(--text-mid);
    }

    /* Tab rail (inside hero for group pages) */
    .tab-rail {
      display: flex; gap: 4px; margin-top: 16px;
      border-bottom: 1px solid rgba(17,17,16,.08); padding-bottom: 0;
    }
    .tab-btn {
      display: flex; align-items: center; gap: 7px; padding: 9px 16px;
      border: none; background: transparent;
      font-family: 'Inter Tight', sans-serif; font-size: 0.84rem; font-weight: 600;
      color: var(--text-muted); cursor: pointer;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      border-radius: 8px 8px 0 0; transition: color .15s;
    }
    .tab-btn:hover { color: var(--text); background: rgba(255,255,255,.5); }
    .tab-btn.active { color: var(--text); border-bottom-color: var(--text); background: transparent; }

    /* ── BUTTONS ────────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px; border-radius: 100px;
      font-family: 'Inter Tight', sans-serif; font-size: 0.875rem; font-weight: 700;
      cursor: pointer; border: none; text-decoration: none; transition: opacity .15s;
    }
    .btn:hover { opacity: .88; }
    .btn.dark { background: var(--cta); color: white; }
    .btn.outline { background: transparent; border: 1.5px solid rgba(17,17,16,.2); color: var(--text); }
    .btn.ghost  { background: rgba(255,255,255,.75); color: var(--text); }
    .btn.sm { padding: 7px 14px; font-size: .8rem; }

    /* ── PAGE SHELL ─────────────────────────────────────────────────────── */
    .page-shell { max-width: 1200px; margin: 0 auto; padding: 32px 32px 80px; }

    /* ── CARDS ──────────────────────────────────────────────────────────── */
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    .card {
      background: white; border-radius: 16px; border: 1px solid var(--border);
      padding: 20px; transition: box-shadow .15s;
    }
    .card.clickable { cursor: pointer; }
    .card.clickable:hover { box-shadow: 0 4px 16px rgba(0,0,0,.08); }
    .card-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; margin-bottom: 12px; }
    .card-title { font-family: 'Inter Tight', sans-serif; font-size: 0.9375rem; font-weight: 700; margin-bottom: 4px; }
    .card-desc { font-size: 0.8125rem; color: var(--text-muted); line-height: 1.4; }
    .section-block { margin-bottom: 36px; }
    .section-head {
      font-family: 'Inter Tight', sans-serif; font-size: 0.7rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 12px;
    }

    /* ── LANDING HERO ───────────────────────────────────────────────────── */
    .landing-hero {
      min-height: 520px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      background: linear-gradient(135deg, #dbeafe 0%, #fde8d8 60%, #fef3c7 100%);
      padding: 80px 32px; position: relative; overflow: hidden;
    }
    .landing-hero::before {
      content: ''; position: absolute; inset: 0;
      background: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1400&q=80') center/cover;
      opacity: .07;
    }
    .landing-hero-inner { position: relative; max-width: 680px; }
    .landing-title { font-family: 'Inter Tight', sans-serif; font-size: clamp(2.4rem, 5vw, 3.8rem); font-weight: 900; letter-spacing: -0.04em; line-height: 1.05; margin-bottom: 16px; }
    .landing-title .serif { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; }
    .landing-lead { font-size: 1.0625rem; color: var(--text-mid); line-height: 1.55; margin-bottom: 28px; max-width: 520px; margin-left: auto; margin-right: auto; }
    .trust-strip { display: flex; align-items: center; justify-content: center; gap: 24px; flex-wrap: wrap; margin-top: 20px; }
    .trust-item { font-size: 0.8rem; color: var(--text-muted); font-family: 'Inter Tight', sans-serif; font-weight: 600; }
    .stats-row {
      display: flex; gap: 32px; justify-content: center; flex-wrap: wrap;
      padding: 24px 32px; background: white; border-bottom: 1px solid var(--border);
    }
    .stat-item { text-align: center; }
    .stat-num { font-family: 'Inter Tight', sans-serif; font-size: 1.5rem; font-weight: 900; color: var(--text); }
    .stat-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; margin-top: 2px; }

    /* ── MISC ───────────────────────────────────────────────────────────── */
    .placeholder-block {
      background: white; border-radius: 12px; border: 1.5px dashed rgba(17,17,16,.15);
      padding: 48px; text-align: center; color: var(--text-muted); font-size: 0.875rem;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .route-debug {
      position: fixed; bottom: 16px; right: 16px;
      background: rgba(17,17,16,.82); color: rgba(255,255,255,.8);
      font-family: monospace; font-size: 0.72rem; padding: 6px 12px;
      border-radius: 8px; z-index: 9999; backdrop-filter: blur(4px);
      pointer-events: none;
    }
    .route-debug span { opacity: .5; margin-right: 4px; }

    /* component annotation label */
    .cmp { font-family: monospace; font-size: .65rem; color: var(--sky); background: rgba(14,165,233,.07); padding: 1px 5px; border-radius: 4px; }

    input[type="text"] {
      padding: 10px 14px; border: 1px solid rgba(17,17,16,.15); border-radius: 10px;
      font-family: 'Inter', sans-serif; font-size: .9rem; outline: none; color: var(--text);
    }
    input[type="text"]:focus { border-color: rgba(17,17,16,.4); box-shadow: 0 0 0 3px rgba(17,17,16,.06); }
  </style>
</head>
<body>

<!-- ════ <app-navbar> ══════════════════════════════════════════════════ -->
<nav class="sn-nav" style="position:sticky;top:0;z-index:100;">
  <div class="nav-inner">

    <a class="nav-brand" onclick="navigate('/')">
      <div class="nav-logo-ring">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/>
        </svg>
      </div>
      <span class="brand-name">Sober Network</span>
    </a>

    <div class="nav-center" id="nav-center"><!-- renderNav() --></div>
    <div class="nav-actions" id="nav-actions"><!-- renderNav() --></div>

  </div>

  <!-- mega menu lives outside nav-inner so it can overlap content -->

        <button class="mm-item" onclick="navigate('/groups/early-bird-zoom');closeMega()">

        </button>
        <button class="mm-item" onclick="closeMega()">
          <div class="mm-icon" style="background:var(--t-green)">➕</div>

        </button>
      </div>
      <div class="mm-col">
        <div class="mm-col-head"><span class="mm-dot" style="background:var(--amber)"></span>Resources</div>

        </button>
        <button class="mm-item" onclick="closeMega()">
          <div class="mm-icon" style="background:var(--t-rose)">📁</div>

        </button>
        <button class="mm-item" onclick="closeMega()">
          <div class="mm-icon" style="background:var(--t-teal)">🔗</div>

        </button>
      </div>

        <div class="mm-col-head"><span class="mm-dot" style="background:var(--green)"></span>Service</div>

        </button>
        <button class="mm-item" onclick="closeMega()">
          <div class="mm-icon" style="background:var(--t-indigo)">🪑</div>
          <div><div class="mm-name">Chair Schedule <span class="pill-cs">Soon</span></div><div class="mm-desc">Who's chairing this week</div></div>
        </button>
        <button class="mm-item" onclick="closeMega()">
          <div class="mm-icon" style="background:var(--t-coral)">🗳️</div>
          <div><div class="mm-name">Group Conscience <span class="pill-cs">Soon</span></div><div class="mm-desc">Votes and group decisions</div></div>
        </button>
      </div>
    </div>
  </div>
</nav>

<!-- ════ <router-outlet> ══════════════════════════════════════════════ -->
<main id="app-main"></main>

<div class="route-debug"><span>route</span><span id="route-display">/</span></div>

<script>
// ── State ─────────────────────────────────────────────────────────────────
let authState   = 'guest';   // 'guest' | 'member'
let currentRoute = '/';
let megaOpen    = false;
let userDropOpen = false;

// ── Route manifest ────────────────────────────────────────────────────────
// Each entry mirrors Angular route + component @Input() config
const ROUTES = {
  '/': {
    auth: 'any', layout: 'landing',
  },
  '/meetings': {
    auth: 'any', layout: 'hero-page',
    eyebrow: 'Public',
    title:    'Find a <span class="serif">Meeting</span>',
    subtitle: 'Search public meetings from A.A. home groups near you.',
    breadcrumbs: [{ label: 'Home', route: '/' }],
  },
  '/dashboard': {
    auth: 'member', layout: 'hero-page',
    eyebrow: 'Community',
    title:    'Welcome back, <span class="serif">Tess.</span>',

    actions.innerHTML = `
      <div class="user-wrap">
        <button class="user-pill" onclick="toggleUserDrop(event)">
          Tess C. <span class="user-initial">T</span>
        </button>
        <div class="user-dropdown" id="user-dropdown">
          <div class="dd-header"><span class="dd-name">Tess C.</span><span class="dd-role">Member</span></div>
          <div class="dd-divider"></div>
          <a class="dd-item" onclick="navigate('/profile');closeUserDrop()"><span class="dd-icon">👤</span> My Profile</a>
          <a class="dd-item" href="#"><span class="dd-icon">⚙️</span> Account Settings</a>
          <div class="dd-divider"></div>
          <a class="dd-item warn" onclick="signOut()"><span class="dd-icon">↩</span> Sign Out</a>
        </div>
      </div>`;
  }
}

// ── renderHero ─────────────────────────────────────────────────────────────
// Mirrors <app-hero [config]="heroConfig"> with <app-breadcrumbs> as ng-content
function renderHero(config) {
  const crumbs = config.breadcrumbs.map(b =>
    `<a class="bc-item" onclick="navigate('${b.route}')">${b.label}</a><span class="bc-sep">›</span>`
  ).join('') + `<span class="bc-item current">${config.title.replace(/<[^>]*>/g,'')}</span>`;

  const tabsHtml = config.tabs ? `
    <div class="tab-rail">
      ${config.tabs.map(t => {
        const active = currentRoute === t.route;
        return `<button class="tab-btn ${active?'active':''}" onclick="navigate('${t.route}')">${t.icon} ${t.label}</button>`;
      }).join('')}
    </div>` : '';

  const metaBadges = config.tabs ? `
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:0;">
      <span class="meta-badge">🌐 Online</span>
      <span class="meta-badge">👥 24 members</span>
      <span class="meta-badge" style="color:var(--green);">✅ Public listing</span>
    </div>` : '';

  return `
    <!-- ════ <app-hero> ════════════════════════════════════════════════ -->
    <div class="app-hero">
      <div class="hero-inner">
        <!-- ════ <app-breadcrumbs> — projected via ng-content ════════ -->
        <div class="app-breadcrumbs">${crumbs}</div>
        <!-- ════════════════════════════════════════════════════════════ -->
        ${config.eyebrow ? `<div class="hero-eyebrow">${config.eyebrow}</div>` : ''}
        <h1 class="hero-title">${config.title}</h1>
        <p class="hero-subtitle">${config.subtitle}</p>
        ${metaBadges}
        ${tabsHtml}
      </div>
    </div>
    <!-- ════ </app-hero> ═══════════════════════════════════════════════ -->`;
}

// ── navigate ───────────────────────────────────────────────────────────────
function navigate(route) {
  const config = ROUTES[route];
  if (!config) return;

  // Soft auth guard: clicking member content auto-signs in for demo
  if (config.auth === 'member' && authState === 'guest') {
    authState = 'member';
  }

  currentRoute = route;
  closeMega();
  closeUserDrop();
  renderNav();

  document.getElementById('route-display').textContent = route;

  const main = document.getElementById('app-main');
  const content = PAGES[route] ? PAGES[route]() : `<div class="page-shell"><div class="placeholder-block">This page is coming soon.</div></div>`;

  if (config.layout === 'landing') {
    main.innerHTML = content;
  } else {
    main.innerHTML = renderHero(config) + content;
  }

  window.scrollTo(0, 0);
}

// ── Auth helpers ──────────────────────────────────────────────────────────
function signIn()  { authState = 'member'; navigate('/dashboard'); }
function signOut() { authState = 'guest';  navigate('/'); }

// ── Mega menu ─────────────────────────────────────────────────────────────
function toggleMega(e) {
  e.stopPropagation();
  megaOpen = !megaOpen;
  document.getElementById('mega-menu').classList.toggle('open', megaOpen);
}
function closeMega() {
  megaOpen = false;
  const m = document.getElementById('mega-menu');
  if (m) m.classList.remove('open');
}

// ── User dropdown ─────────────────────────────────────────────────────────
function toggleUserDrop(e) {
  e.stopPropagation();
  userDropOpen = !userDropOpen;
  const d = document.getElementById('user-dropdown');
  if (d) d.classList.toggle('open', userDropOpen);
}
function closeUserDrop() {
  userDropOpen = false;
  const d = document.getElementById('user-dropdown');
  if (d) d.classList.remove('open');
}

document.addEventListener('click', () => { closeMega(); closeUserDrop(); });

// Boot
navigate('/');
</script>
</body>
</html>
