# fly.toml — Sober Network
# Fly.io terminates TLS at the edge; the container listens on HTTP port 8080.
# All sensitive config (connection string, JWT secret, Resend key) is stored as
# Fly secrets (flyctl secrets set) and never committed to source control.

app = "sober-network"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  Jwt__Issuer             = "sober-network"
  Jwt__Audience           = "sober-network"
  Jwt__ExpiryHours        = "1"
  Jwt__RefreshExpiryDays  = "30"
  # Update App__BaseUrl after running `fly launch` to match the assigned *.fly.dev hostname,
  # then update again when sobernetwork.group is live.
  App__BaseUrl            = "https://sober-network.fly.dev"

[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes           = ["app"]

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory   = "256mb"
  cpu_kind = "shared"
  cpus     = 1

[checks]
  [checks.health]
    grace_period = "10s"
    interval     = "30s"
    method       = "GET"
    path         = "/health"
    port         = 8080
    timeout      = "5s"
    type         = "http"
