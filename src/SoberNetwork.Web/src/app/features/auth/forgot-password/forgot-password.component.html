<div class="auth-page">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Forgot Password</mat-card-title>
      <mat-card-subtitle>We'll send you a reset link</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <div *ngIf="success" class="auth-info">
        <mat-icon style="vertical-align:middle">mark_email_read</mat-icon>
        If that email is registered, a reset link is on its way.
      </div>

      <form *ngIf="!success" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
          <mat-icon matSuffix>email</mat-icon>
          <mat-error *ngIf="form.get('email')?.hasError('required')">Email is required</mat-error>
          <mat-error *ngIf="form.get('email')?.hasError('email')">Enter a valid email</mat-error>
        </mat-form-field>

        <p class="auth-error" *ngIf="error">{{ error }}</p>

        <button mat-raised-button color="primary" class="full-width submit-btn"
                type="submit" [disabled]="loading">
          <mat-spinner diameter="20" *ngIf="loading"></mat-spinner>
          <span *ngIf="!loading">Send Reset Link</span>
        </button>
      </form>
    </mat-card-content>

    <mat-card-actions>
      <a mat-button routerLink="/auth/login">Back to sign in</a>
    </mat-card-actions>
  </mat-card>
</div>
