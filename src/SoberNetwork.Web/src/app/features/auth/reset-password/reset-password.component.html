<div class="auth-page">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Reset Password</mat-card-title>
      <mat-card-subtitle>Choose a new password</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <div *ngIf="success" class="auth-info">
        <mat-icon style="vertical-align:middle">check_circle</mat-icon>
        Password updated! You can now <a routerLink="/auth/login">sign in</a>.
      </div>

      <form *ngIf="!success" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>New Password</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'"
                 formControlName="password" autocomplete="new-password" />
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-hint>Minimum 8 characters</mat-hint>
          <mat-error *ngIf="form.get('password')?.hasError('required')">Password is required</mat-error>
          <mat-error *ngIf="form.get('password')?.hasError('minlength')">At least 8 characters</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Confirm Password</mat-label>
          <input matInput [type]="hideConfirm ? 'password' : 'text'"
                 formControlName="confirmPassword" autocomplete="new-password" />
          <button mat-icon-button matSuffix type="button" (click)="hideConfirm = !hideConfirm">
            <mat-icon>{{ hideConfirm ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="form.hasError('passwordsMismatch')">Passwords do not match</mat-error>
        </mat-form-field>

        <p class="auth-error" *ngIf="error">{{ error }}</p>

        <button mat-raised-button color="primary" class="full-width submit-btn"
                type="submit" [disabled]="loading">
          <mat-spinner diameter="20" *ngIf="loading"></mat-spinner>
          <span *ngIf="!loading">Reset Password</span>
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
