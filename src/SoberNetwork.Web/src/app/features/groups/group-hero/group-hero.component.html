<section class="hero-section">
  <img [src]="backgroundImageSrc" alt="Group circle" class="hero-bg" />
  <a *ngIf="backButtonText" [routerLink]="backButtonRoute" class="back-button">{{ backButtonText }}</a>
  
  <button
    *ngIf="showPlusButton"
    (click)="onPlusClick()"
    class="plus-button"
    [class.has-text]="!!plusButtonText"
    type="button"
    [attr.aria-label]="plusButtonText || 'Add meeting'">
    <mat-icon>add</mat-icon>
    <span *ngIf="plusButtonText" class="plus-label">{{ plusButtonText }}</span>
  </button>

<button 
  *ngIf="showSettingsButton" 
  (click)="onSettingsClick()" 
  class="settings-button"
  type="button"
  [attr.aria-label]="settingsButtonText || 'Settings'">
  <mat-icon>settings</mat-icon>
  <span *ngIf="settingsButtonText" class="settings-label">{{ settingsButtonText }}</span>
</button>

<div class="section-wrap">
  <div class="hero-inner">
    <app-breadcrumbs *ngIf="breadcrumbs.length" [items]="breadcrumbs"></app-breadcrumbs>
    <div *ngIf="eyebrowText" class="hero-eyebrow">
      <span class="eyebrow-dot"></span>
      {{ eyebrowText }}
    </div>
    <h1>
      {{ title }}
      <span *ngIf="titleSuffix" class="serif-accent"> {{ titleSuffix }}</span>
    </h1>
    <p *ngIf="description" [class.description-italic]="descriptionItalic">{{ description }}</p>
  </div>

  <div *ngIf="tags.length" class="hero-tags-card">
    <div class="tags-row">
      <span *ngFor="let tag of tags" class="tag-pill tag-{{ tag.color }}">{{ tag.label }}</span>
    </div>
  </div>
</div>
</section>
