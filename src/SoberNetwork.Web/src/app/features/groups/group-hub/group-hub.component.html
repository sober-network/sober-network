<app-group-hero
  eyebrowText="Home Group"
  [title]="group?.name || ''"
  [backButtonRoute]="['/dashboard']"
  [showPlusButton]="activeTab === 'meetings' && isAdmin"
  (plusClick)="openCreateMeeting()"
></app-group-hero>

<div class="hub-loading" *ngIf="loading">
  <mat-spinner diameter="40"></mat-spinner>
  <p>Loading group…</p>
</div>

<div class="hub-error" *ngIf="error && !loading">
  <mat-icon>error_outline</mat-icon>
  {{ error }}
</div>

<div class="hub-shell" *ngIf="group && !loading">
  <div class="tab-rail">
    <button class="tab-btn" [class.active]="activeTab === 'overview'" (click)="switchTab('overview')">Overview</button>

    <button class="tab-btn" [class.active]="activeTab === 'members'" (click)="switchTab('members')">
      Members
      <span class="tab-badge badge-violet">{{ group.memberCount }}</span>
    </button>

    <button class="tab-btn" [class.active]="activeTab === 'meetings'" (click)="switchTab('meetings')">
      Meetings
      <span class="tab-badge badge-sky">{{ group.meetings.length }}</span>
    </button>

    <button *ngIf="isAdmin" class="tab-btn admin-tab" [class.active]="activeTab === 'requests'" (click)="switchTab('requests')">Join Requests</button>

    <button *ngIf="isAdmin" class="tab-btn admin-tab" [class.active]="activeTab === 'settings'" (click)="switchTab('settings')">Settings</button>
  </div>

  <div class="tab-content">
    <app-overview-tab
      *ngIf="activeTab === 'overview'"
      [group]="group"
      [slug]="slug"
      [isAdmin]="isAdmin"
      (switchToMeetings)="switchTab('meetings')"
      (leaveGroup)="onLeaveGroup()"
    ></app-overview-tab>

    <app-members-tab
      *ngIf="activeTab === 'members'"
      [slug]="slug"
      [isAdmin]="isAdmin"
      [memberCount]="group.memberCount"
    ></app-members-tab>

    <app-meetings-tab
      *ngIf="activeTab === 'meetings'"
      [slug]="slug"
      [isAdmin]="isAdmin"
      [reloadToken]="meetingsReloadToken"
    ></app-meetings-tab>

    <app-requests-tab *ngIf="isAdmin && activeTab === 'requests'" [slug]="slug"></app-requests-tab>

    <app-settings-tab
      *ngIf="isAdmin && activeTab === 'settings'"
      [slug]="slug"
      [group]="group"
      (groupUpdated)="onGroupUpdated($event)"
      (groupDeleted)="onGroupDeleted()"
    ></app-settings-tab>
  </div>
</div>
