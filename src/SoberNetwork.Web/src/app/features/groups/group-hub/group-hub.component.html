<app-group-hero
  eyebrowText="Group Hub"
  [title]="group?.name || ''"
  titleSuffix="Hub"
  description="Your group's hub for meetings, members, and more."
  [descriptionItalic]="true"
  backButtonText="← Back to My Groups"
  [backButtonRoute]="['/dashboard']"
  [showPlusButton]="activeTab === 'meetings' && isAdmin"
  (plusClick)="openCreateMeeting()"
  [tags]="heroTags"
></app-group-hero>

<div class="hub-shell">

  <div class="hub-loading" *ngIf="loading">
    <mat-spinner diameter="40"></mat-spinner>
    <p>Loading group…</p>
  </div>

  <div class="hub-error" *ngIf="error && !loading">
    <mat-icon>error_outline</mat-icon>
    {{ error }}
  </div>

  <div class="page" *ngIf="group && !loading">

    <!-- Tab Rail -->
    <div class="tab-rail" role="tablist">

      <button
        class="tab-btn"
        role="tab"
        [attr.aria-selected]="activeTab === 'overview'"
        [class.active]="activeTab === 'overview'"
        (click)="switchTab('overview')"
      >Overview</button>

      <button
        class="tab-btn"
        role="tab"
        [attr.aria-selected]="activeTab === 'members'"
        [class.active]="activeTab === 'members'"
        (click)="switchTab('members')"
      >
        Members
        <span class="tab-badge tab-badge-violet">{{ group.memberCount }}</span>
      </button>

      <button
        class="tab-btn"
        role="tab"
        [attr.aria-selected]="activeTab === 'meetings'"
        [class.active]="activeTab === 'meetings'"
        (click)="switchTab('meetings')"
      >
        Meetings
        <span class="tab-badge tab-badge-sky">{{ group.meetings.length }}</span>
      </button>

      <button
        *ngIf="isAdmin"
        class="tab-btn admin-tab"
        role="tab"
        [attr.aria-selected]="activeTab === 'requests'"
        [class.active]="activeTab === 'requests'"
        (click)="switchTab('requests')"
      >
        Join Requests
        <span class="tab-admin-badge tab-badge-green">Admin</span>
      </button>

      <button
        *ngIf="isAdmin"
        class="tab-btn admin-tab"
        role="tab"
        [attr.aria-selected]="activeTab === 'settings'"
        [class.active]="activeTab === 'settings'"
        (click)="switchTab('settings')"
      >
        Settings
        <span class="tab-admin-badge tab-badge-amber">Admin</span>
      </button>

    </div><!-- /tab-rail -->

    <!-- Tab Panels -->
    <div class="tab-panel">

      <app-overview-tab
        *ngIf="activeTab === 'overview'"
        [group]="group"
        [slug]="slug"
        [isAdmin]="isAdmin"
        (leaveGroup)="onLeaveGroup()"
      ></app-overview-tab>

      <app-members-tab
        *ngIf="activeTab === 'members'"
        [slug]="slug"
        [isAdmin]="isAdmin"
        [memberCount]="group.memberCount"
      ></app-members-tab>

      <app-meetings-tab
        *ngIf="activeTab === 'meetings'"
        [slug]="slug"
        [isAdmin]="isAdmin"
        [reloadToken]="meetingsReloadToken"
        [selectedMeetingId]="selectedMeetingId"
      ></app-meetings-tab>

      <app-requests-tab
        *ngIf="isAdmin && activeTab === 'requests'"
        [slug]="slug"
      ></app-requests-tab>

      <app-settings-tab
        *ngIf="isAdmin && activeTab === 'settings'"
        [slug]="slug"
        [group]="group"
        (groupUpdated)="onGroupUpdated($event)"
        (groupDeleted)="onGroupDeleted()"
      ></app-settings-tab>

    </div><!-- /tab-panel -->

  </div><!-- /page -->

</div><!-- /hub-shell -->
