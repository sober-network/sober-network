<app-group-hero
  eyebrowText="Join requests"
  [title]="groupName"
  titleSuffix="Requests"
  description="Review the folks waiting at the door and respond with care."
  [backButtonRoute]="['/groups', slug]"
  backButtonText="← Back to Group"
></app-group-hero>

<app-group-page-wrapper>

  <app-group-card class="feedback-card" *ngIf="error">
    <div class="card-content">{{ error }}</div>
  </app-group-card>

  <div class="loading-state" *ngIf="loading">
    <mat-spinner diameter="40"></mat-spinner>
    <p>Loading pending requests…</p>
  </div>

  <ng-container *ngIf="!loading">
    <app-group-card class="empty-card" *ngIf="requests.length === 0">
      <div class="card-content">
        <mat-icon>mark_email_read</mat-icon>
        <h2>No pending requests</h2>
        <p>When someone asks to join, their request will appear here.</p>
      </div>
    </app-group-card>

    <div class="request-list" *ngIf="requests.length > 0">
      <app-group-card class="request-card" *ngFor="let request of requests; trackBy: trackByUserId">
        <div class="card-content">
          <div class="request-header">
            <div>
              <h2>{{ request.displayName }}</h2>
              <p>{{ request.email }}</p>
            </div>
            <span>Requested {{ request.requestedAt | date:'medium' }}</span>
          </div>

          <p class="request-message" *ngIf="request.message">“{{ request.message }}”</p>

          <div class="request-actions">
            <button mat-raised-button class="approve-button" type="button" [disabled]="actionUserId === request.userId" (click)="approve(request)">
              Approve
            </button>
            <button mat-stroked-button color="warn" type="button" [disabled]="actionUserId === request.userId" (click)="confirmReject(request)">
              Reject
            </button>
          </div>
        </div>
      </app-group-card>
    </div>

    <mat-paginator
      *ngIf="totalCount > pageSize"
      [length]="totalCount"
      [pageIndex]="pageIndex"
      [pageSize]="pageSize"
      [pageSizeOptions]="[5, 10, 25, 50]"
      (page)="onPageChange($event)"
    ></mat-paginator>
  </ng-container>
</app-group-page-wrapper>
