<!-- ══ MEETING FORM MODAL ═════════════════════════════════════════════════════ -->
<app-base-form-modal
  [title]="editingId ? 'Edit Meeting' : 'Create Meeting'"
  subtitle="Set up meeting details, schedule, and location."
  icon="event">

  <!-- Loader state -->
  <div class="form-modal-body" *ngIf="!form">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

  <!-- Form state -->
  <form [formGroup]="form" (ngSubmit)="save()" novalidate class="lm-form" *ngIf="form">
    
    <!-- BASICS SECTION -->
    <div class="form-section">
      <h4>Basics</h4>
      
      <div class="lm-field">
        <div class="lm-label-row">
          <label class="lm-label">Meeting Name</label>
          <span class="lm-label" style="font-weight: 400; font-size: 0.75rem;">{{ form.get('name')?.value?.length ?? 0 }}/100</span>
        </div>
        <input 
          type="text"
          class="lm-input"
          formControlName="name"
          maxlength="100"
          placeholder="Enter meeting name"
        />
        <div class="lm-field-error" *ngIf="form.get('name')?.touched && form.get('name')?.hasError('required')">
          Name is required.
        </div>
        <div class="lm-field-error" *ngIf="form.get('name')?.touched && form.get('name')?.hasError('minlength')">
          At least 2 characters.
        </div>
      </div>

      <div class="lm-field">
        <div class="lm-label-row">
          <label class="lm-label">Description</label>
          <span class="lm-label" style="font-weight: 400; font-size: 0.75rem;">{{ form.get('description')?.value?.length ?? 0 }}/500</span>
        </div>
        <textarea 
          class="lm-input lm-textarea"
          formControlName="description"
          rows="2"
          maxlength="500"
          placeholder="Describe the meeting"
        ></textarea>
      </div>
    </div>

    <!-- SCHEDULE SECTION -->
    <div class="form-section">
      <h4>Schedule</h4>
      
      <div class="toggle-row">
        <label class="lm-label">Recurring meeting</label>
        <mat-slide-toggle formControlName="isRecurring"></mat-slide-toggle>
      </div>
      
      <div *ngIf="isRecurring" class="days-of-week-container">
        <label class="lm-label">Days of Week (select at least one):</label>
        <div class="checkbox-group">
          <label class="checkbox-item">
            <input type="checkbox" [checked]="isDaySelected(0)" (change)="toggleDay(0)" />
            <span>Sun</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" [checked]="isDaySelected(1)" (change)="toggleDay(1)" />
            <span>Mon</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" [checked]="isDaySelected(2)" (change)="toggleDay(2)" />
            <span>Tue</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" [checked]="isDaySelected(3)" (change)="toggleDay(3)" />
            <span>Wed</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" [checked]="isDaySelected(4)" (change)="toggleDay(4)" />
            <span>Thu</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" [checked]="isDaySelected(5)" (change)="toggleDay(5)" />
            <span>Fri</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" [checked]="isDaySelected(6)" (change)="toggleDay(6)" />
            <span>Sat</span>
          </label>
        </div>
      </div>

      <div class="lm-field" *ngIf="!isRecurring">
        <label class="lm-label">Date</label>
        <input 
          type="date"
          class="lm-input"
          formControlName="occursOn"
        />
      </div>

      <div class="lm-field">
        <label class="lm-label">Time (HH:mm, 24-hour)</label>
        <input 
          type="time"
          class="lm-input"
          formControlName="time"
        />
      </div>

      <div class="lm-field">
        <label class="lm-label">Duration (minutes)</label>
        <input 
          type="number"
          class="lm-input"
          formControlName="durationMinutes"
          min="15"
        />
      </div>
    </div>

    <!-- MEETING TYPE SECTION -->
    <div class="form-section">
      <h4>Meeting Type</h4>
      
      <div class="lm-field">
        <label class="lm-label">Type</label>
        <select class="lm-input" formControlName="meetingType" [compareWith]="compareMeetingType">
          <option [value]="MeetingType.Online">Online</option>
          <option [value]="MeetingType.InPerson">In Person</option>
          <option [value]="MeetingType.Hybrid">Hybrid</option>
        </select>
      </div>

      <div class="lm-field" *ngIf="isInPersonOrHybrid">
        <label class="lm-label">Venue Name</label>
        <input 
          type="text"
          class="lm-input"
          formControlName="venueName"
          maxlength="100"
          placeholder="Church, Community Center, etc."
        />
      </div>

      <div class="lm-field" *ngIf="isInPersonOrHybrid">
        <label class="lm-label">Street Address</label>
        <input 
          type="text"
          class="lm-input"
          formControlName="street"
          maxlength="100"
          placeholder="123 Main St"
        />
      </div>

      <div class="lm-field" *ngIf="isInPersonOrHybrid">
        <label class="lm-label">City</label>
        <input 
          type="text"
          class="lm-input"
          formControlName="city"
          maxlength="50"
          placeholder="City name"
        />
      </div>

      <div class="lm-field" *ngIf="isInPersonOrHybrid">
        <label class="lm-label">State/Province</label>
        <select class="lm-input" formControlName="state">
          <option value="">Select state/province</option>
          <option *ngFor="let state of readonly.states" [value]="state">{{ state }}</option>
        </select>
      </div>

      <div class="lm-field" *ngIf="isInPersonOrHybrid">
        <label class="lm-label">Postal Code</label>
        <input 
          type="text"
          class="lm-input"
          formControlName="postalCode"
          maxlength="20"
          placeholder="ZIP or postal code"
        />
      </div>

      <div class="lm-field" *ngIf="isInPersonOrHybrid">
        <label class="lm-label">Country</label>
        <select class="lm-input" formControlName="country">
          <option value="">Select country</option>
          <option *ngFor="let country of readonly.countries" [value]="country">{{ country }}</option>
        </select>
      </div>
    </div>

    <!-- ZOOM SECTION (Online/Hybrid) -->
    <div class="form-section" *ngIf="isOnlineOrHybrid">
      <h4>Online Details</h4>

      <div class="lm-field">
        <label class="lm-label">Public Join URL</label>
        <input 
          type="url"
          class="lm-input"
          formControlName="publicJoinUrl"
          maxlength="500"
          placeholder="https://zoom.us/j/..."
        />
        <div class="lm-field-error" *ngIf="form.get('publicJoinUrl')?.touched && form.get('publicJoinUrl')?.hasError('pattern')">
          Must be a valid URL.
        </div>
      </div>

      <div class="lm-field">
        <label class="lm-label">Zoom Link (members-only)</label>
        <input 
          type="url"
          class="lm-input"
          formControlName="zoomLink"
          maxlength="500"
          placeholder="https://zoom.us/j/... (full link with passcode)"
        />
        <div class="lm-field-error" *ngIf="form.get('zoomLink')?.touched && form.get('zoomLink')?.hasError('pattern')">
          Must be a valid URL.
        </div>
      </div>

      <div class="lm-field">
        <label class="lm-label">Zoom Meeting ID</label>
        <input 
          type="text"
          class="lm-input"
          formControlName="zoomMeetingId"
          maxlength="20"
          placeholder="123456789"
        />
      </div>

      <div class="lm-field">
        <label class="lm-label">Zoom Passcode</label>
        <input 
          type="text"
          class="lm-input"
          formControlName="zoomPasscode"
          maxlength="20"
          placeholder="ABC123"
        />
      </div>
    </div>
    <div class="form-section formats-container">
      <h4>Formats</h4>
      <label class="checkbox-label">Select all that apply</label>
      <div class="checkbox-group">
        <label class="checkbox-item" *ngFor="let format of meetingFormats">
          <input type="checkbox" [checked]="form.get('formats')?.value?.includes(format)" (change)="updateFormat(format)" />
          <span>{{ formatMeetingLabel(format) }}</span>
        </label>
      </div>
    </div>

    <!-- Error message -->
    <div class="error-message" *ngIf="formError">{{ formError }}</div>

    <!-- Action buttons -->
    <div class="form-actions">
      <button type="button" class="btn-secondary" (click)="cancel()" [disabled]="saving">
        Cancel
      </button>
      <button type="submit" class="btn-primary" [disabled]="saving || form.invalid">
        {{ saving ? 'Saving…' : (editingId ? 'Update' : 'Create') }}
      </button>
    </div>

    <!-- Delete button (small, secondary, below main actions) -->
    <button *ngIf="editingId" type="button" class="btn-delete-small" (click)="delete()" [disabled]="saving">
      Delete Meeting
    </button>

  </form>

</app-base-form-modal>
