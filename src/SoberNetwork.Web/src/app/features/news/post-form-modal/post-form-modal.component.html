<!-- ══ POST FORM MODAL ═══════════════════════════════════════════════════ -->
<app-base-form-modal
  [title]="title"
  [subtitle]="subtitle"
  icon="campaign"
  [useRainbowRing]="true"
>
  <form [formGroup]="form" (ngSubmit)="save()" class="pf-form" novalidate>

    <!-- Group selector (create mode only) -->
    <div class="pf-field" *ngIf="!isEditMode && data.groups.length > 1">
      <label class="pf-label" for="pf-group">Post to group</label>
      <div class="pf-select-wrap">
        <select id="pf-group" formControlName="groupSlug" class="pf-select">
          <option *ngFor="let g of data.groups" [value]="g.slug">{{ g.name }}</option>
        </select>
        <span class="pf-select-arrow">▾</span>
      </div>
    </div>

    <!-- Subject -->
    <div class="pf-field">
      <label class="pf-label" for="pf-subject">Subject <span class="pf-required">*</span></label>
      <input
        id="pf-subject"
        type="text"
        formControlName="subject"
        class="pf-input"
        placeholder="What's this about?"
        autocomplete="off"
        maxlength="200"
      />
      <div class="pf-error"
        *ngIf="form.controls.subject.invalid && form.controls.subject.touched">
        Subject is required (max 200 characters).
      </div>
    </div>

    <!-- Body -->
    <div class="pf-field">
      <label class="pf-label" for="pf-body">
        Message <span class="pf-required">*</span>
        <span class="pf-char-count">{{ bodyLength }}/5000</span>
      </label>
      <div class="pf-textarea-wrap">
        <textarea
          #bodyTextarea
          id="pf-body"
          formControlName="body"
          class="pf-textarea"
          rows="5"
          placeholder="Share your update, news, or announcement…"
          maxlength="5000"
        ></textarea>
        <button
          type="button"
          class="pf-emoji-btn"
          (click)="showEmojiPicker = !showEmojiPicker; $event.stopPropagation()"
          title="Add emoji"
        >😊</button>
        <app-emoji-picker
          *ngIf="showEmojiPicker"
          placement="above"
          class="pf-emoji-picker"
          (emojiSelected)="insertEmoji($event)"
          (closed)="showEmojiPicker = false"
        ></app-emoji-picker>
      </div>
      <div class="pf-error"
        *ngIf="form.controls.body.invalid && form.controls.body.touched">
        Message is required (max 5,000 characters).
      </div>
    </div>

    <!-- Optional fields toggle -->
    <button
      type="button"
      class="pf-optional-toggle"
      (click)="showOptional = !showOptional"
    >
      <span>{{ showOptional ? '▾ Hide' : '▸ Add' }} media &amp; link</span>
    </button>

    <div class="pf-optional-fields" *ngIf="showOptional">

      <!-- Media Upload -->
      <div class="pf-field">
        <label class="pf-label">Media upload <span class="pf-hint">(optional, JPEG/PNG up to 5MB or MP4 up to 50MB)</span></label>
        
        <!-- Upload zone -->
        <div 
          class="pf-media-zone"
          [class.pf-media-zone--drag]="isDragOver"
          (dragover)="onDragOver($event)"
          (dragleave)="onDragLeave()"
          (drop)="onDrop($event)"
        >
          <input
            #fileInput
            type="file"
            class="pf-file-input"
            accept="image/jpeg,image/png,video/mp4"
            (change)="onFileSelected($event)"
          />

          <div class="pf-media-zone-content">
            <span class="pf-media-zone-icon">📁</span>
            <p class="pf-media-zone-text">
              <strong>Drag files here</strong> or <button type="button" class="pf-link-btn" (click)="fileInput.click()">browse</button>
            </p>
            <p class="pf-media-zone-hint">Supported: JPEG, PNG (images), MP4 (videos)</p>
          </div>

          <!-- Progress bar during upload -->
          <mat-progress-bar
            *ngIf="uploading"
            mode="indeterminate"
            class="pf-upload-progress"
          ></mat-progress-bar>
        </div>

        <!-- Media preview -->
        <div class="pf-media-preview" *ngIf="previewUrl">
          <div class="pf-preview-item">
            <img *ngIf="mediaType === 'image'" [src]="previewUrl" alt="Preview" class="pf-preview-img" />
            <video *ngIf="mediaType === 'video'" [src]="previewUrl" class="pf-preview-video" controls></video>
            <button type="button" class="pf-preview-remove" (click)="clearMedia()" title="Remove media">✕</button>
          </div>
        </div>
      </div>

      <!-- Link URL -->
      <div class="pf-field">
        <label class="pf-label" for="pf-link-url">Link URL <span class="pf-hint">(optional)</span></label>
        <input
          id="pf-link-url"
          type="url"
          formControlName="linkUrl"
          class="pf-input"
          placeholder="https://example.com"
        />
      </div>

      <!-- Link Title -->
      <div class="pf-field">
        <label class="pf-label" for="pf-link-title">Link title <span class="pf-hint">(optional)</span></label>
        <input
          id="pf-link-title"
          type="text"
          formControlName="linkTitle"
          class="pf-input"
          placeholder="e.g. Read more about this topic"
        />
      </div>

    </div>

    <!-- Error message -->
    <div class="pf-server-error" *ngIf="error">{{ error }}</div>

    <!-- Actions -->
    <div class="pf-actions">
      <button type="button" class="pf-btn pf-btn--cancel" (click)="cancel()">Cancel</button>
      <button type="submit" class="pf-btn pf-btn--submit" [disabled]="saving">
        <span *ngIf="!saving">{{ isEditMode ? 'Save Changes' : 'Post' }}</span>
        <mat-spinner *ngIf="saving" diameter="18"></mat-spinner>
      </button>
    </div>

  </form>
</app-base-form-modal>
