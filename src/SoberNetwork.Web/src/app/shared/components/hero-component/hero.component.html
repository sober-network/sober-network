<section class="hero-section">
  <div class="section-wrap">
    <a *ngIf="backButtonText" [routerLink]="backButtonRoute" class="back-button">{{ backButtonText }}</a>

    <button 
      *ngIf="showSettingsButton" 
      (click)="onSettingsClick()" 
      class="settings-button"
      type="button"
      aria-label="Settings">
      <ng-content select=".settings-icon"></ng-content>
    </button>

    <div class="hero-inner">
      <div *ngIf="eyebrowText" class="hero-eyebrow">{{ eyebrowText }}</div>
      <h1>{{ title }}</h1>
      <p *ngIf="description">{{ description }}</p>
    </div>
  </div>
</section>
