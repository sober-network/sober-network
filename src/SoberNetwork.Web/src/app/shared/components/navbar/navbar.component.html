    <!-- ── GUEST: landing-section pills ──────────────────────────────────── -->
    <ng-container *ngIf="!user">
      <div class="nav-pill">
        <a href="#about"        class="nav-link" [class.active]="activeAnchor === 'about'">About</a>
        <a href="#features"     class="nav-link" [class.active]="activeAnchor === 'features'">Features</a>
        <a href="#traditions"   class="nav-link" [class.active]="activeAnchor === 'traditions'">12 Traditions</a>
        <a routerLink="/meetings" class="nav-link">Find a Meeting</a>
      </div>
      <div class="nav-actions">
        <button type="button" class="nav-cta" (click)="openSignIn()">
          Sign In
          <span class="arrow-circle">
            <svg viewBox="0 0 12 12" fill="none">
              <path d="M1 11L11 1M11 1H4.5M11 1V7.5" stroke="currentColor"
                    stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </button>
      </div>
    </ng-container>

    <!-- ── LOGGED IN: app nav pills ──────────────────────────────────────── -->
    <ng-container *ngIf="user">
      <div class="nav-pill">
        <a routerLink="/meetings"  routerLinkActive="active" class="nav-link">Find a Meeting</a>

        <!-- My Groups dropdown (in-DOM, anchored to its trigger) -->
        <div class="menu-anchor dropdown-wrap" *ngIf="myGroups.length > 0">
          <button type="button" class="nav-link nav-link-btn dropdown-trigger"
                  [class.active]="isGroupRouteActive()"
                  [class.open]="groupsMenuOpen"
                  (click)="toggleGroupsMenu($event)"
                  aria-haspopup="true" [attr.aria-expanded]="groupsMenuOpen">
            My Groups
            <svg class="caret" width="10" height="10" viewBox="0 0 10 10" fill="none">
              <path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <div class="sn-dropdown groups-dropdown" *ngIf="groupsMenuOpen"
               (click)="$event.stopPropagation()" role="menu">
            <div class="dd-section-title">My Groups</div>

            <button type="button" class="dd-group-item" *ngFor="let g of myGroups; trackBy: trackBySlug; let i = index"
                    (click)="navigateToGroup(g.slug)" role="menuitem">
              <div class="dd-group-icon" [ngClass]="getGroupIconColor(i)">
                {{ g.name.charAt(0).toUpperCase() }}
              </div>
              <div class="dd-group-info">
                <span class="dd-group-name">{{ g.name }}</span>
                <span class="dd-group-meta">{{ groupMeta(g) }}</span>
              </div>
              <span class="pill-admin sm" *ngIf="g.userRole === 'GroupAdmin'">Admin</span>
            </button>

            <div class="dropdown-divider"></div>

            <a class="sn-dropdown-item" routerLink="/dashboard" (click)="closeMenus()" role="menuitem">
              <span class="dd-icon">📋</span><span>All My Groups</span>
            </a>
            <button type="button" class="sn-dropdown-item" (click)="openCreateGroupDialog()" role="menuitem">
              <span class="dd-icon">➕</span><span>Create Group</span>
            </button>
          </div>
        </div>

        <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">Dashboard</a>
        <a routerLink="/admin"     routerLinkActive="active" class="nav-link"
           *ngIf="user.isSuperAdmin">Admin</a>
      </div>

      <div class="nav-actions">
        <!-- Account dropdown (in-DOM, anchored to the user pill) -->
        <div class="menu-anchor">
          <button type="button" class="user-pill"
                  [class.open]="userMenuOpen"
                  (click)="toggleUserMenu($event)"
                  aria-haspopup="true" [attr.aria-expanded]="userMenuOpen" aria-label="Account menu">
            <span class="user-display-name">{{ user.displayName }}</span>
            <span class="user-initial">{{ user.displayName[0]?.toUpperCase() }}</span>
          </button>

          <div class="sn-dropdown user-dropdown" *ngIf="userMenuOpen"
               (click)="$event.stopPropagation()" role="menu">
            <div class="dd-header">
              <div class="dd-avatar" [style.background]="getUserAvatarBackground(user.displayName)">
               {{ user.displayName[0]?.toUpperCase() }}
              </div>
              <div class="dd-user-info">
               <span class="dd-name">{{ user.displayName }}</span>
               <span class="dd-email">{{ user.email }}</span>
              </div>
            </div>
            <div class="dropdown-divider"></div>
            <a class="sn-dropdown-item dd-item" routerLink="/profile" (click)="closeMenus()" role="menuitem">
              <span class="dd-icon">👤</span><span>My Profile</span>
            </a>
            <a class="sn-dropdown-item dd-item" routerLink="/dashboard" (click)="closeMenus()" role="menuitem">
              <span class="dd-icon">🏠</span><span>Dashboard</span>
            </a>
            <div class="dropdown-divider"></div>
            <button type="button" class="sn-dropdown-item dd-item warn" (click)="logout()" role="menuitem">
              <span class="dd-icon">↩</span><span>Sign Out</span>
            </button>
          </div>
        </div>
      </div>
    </ng-container>

  </div>
</nav>
